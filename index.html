<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- CORREÇÃO DE SEGURANÇA E CONEXÃO -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src * self blob: data: gap:; style-src * self 'unsafe-inline' blob: data: gap:; script-src * 'self' 'unsafe-eval' 'unsafe-inline' blob: data: gap:; object-src * 'self' blob: data: gap:; img-src * self 'unsafe-inline' blob: data: gap:; connect-src self * 'unsafe-inline' blob: data: gap:; frame-src * self blob: data: gap:;">

    <title>TEA PLANNER (Sync Final Fix)</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0f1a2a;
            --panel: #0f223d;
            --ink: #e9f1ff;
            --brand: #1976d2;
            --muted: #9fb3d2;
            --card: #112b4a
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        header.app {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            background: var(--brand);
            color: #fff;
            flex-wrap: wrap;
            transition: background-color .3s;
            flex-shrink: 0;
        }

        header.app.filters-active {
            background: #b85d00
        }

        header.app h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            margin-right: auto;
            display: flex;
            align-items: center;
        }

        .header-icon {
            width: 22px;
            height: 22px;
            stroke: #fff;
            vertical-align: -4px;
            margin-right: 8px;
        }

        header.app input,
        header.app button {
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            background: #0e58a5;
            color: #fff
        }

        header.app button {
            cursor: pointer
        }

        header.app button.active {
            background: #ffd54f;
            color: #10243a
        }

        #sumTimersDisplay {
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 6px;
            margin-left: 5px;
            margin-right: 5px;
            cursor: help;
        }

        .badge {
            display: inline-block;
            background: #ffd54f;
            color: #10243a;
            font-weight: 700;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            border: 1px solid rgba(0, 0, 0, .15)
        }

        .badge[hidden] {
            display: none !important
        }

        /* Toggle Switch styles */
        .toggle-switch {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .toggle-switch-input {
            display: none;
        }

        .toggle-switch-label {
            font-size: 16px;
            user-select: none;
        }

        .toggle-switch-input:checked+.toggle-switch-label {
            color: #ffd54f;
        }

        .toggle-switch-input:checked+.toggle-switch-label+.toggle-switch-button {
            background: #ffd54f;
        }

        .toggle-switch-button {
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 6px;
            background: #0e58a5;
            color: #10243a;
            transition: background .2s;
        }

        .workspace {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 58px);
            padding: 12px;
            gap: 12px;
            transition: gap .3s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-width: 0;
            position: relative;
            transition: flex .3s ease-in-out, width .3s ease-in-out, min-width .3s ease-in-out, opacity .3s ease-in-out;
            width: 100%;
            /* CURSOR MUDADO PARA INDICAR QUE PODE ARRASTAR */
            cursor: grab;
        }

        /* Quando estiver arrastando */
        #main-content:active {
            cursor: grabbing;
        }

        #main-content.collapsed {
            flex: 0 0 0px;
            min-width: 0;
            opacity: 0;
            padding: 0;
            overflow: hidden;
        }

        .board-container,
        .matrix-container {
            position: relative;
            transition: height .3s ease-in-out, min-height .3s ease-in-out, opacity .3s ease-in-out, padding .3s ease-in-out, flex-grow .3s ease-in-out, flex-shrink .3s ease-in-out;
            overflow: hidden;
            flex-shrink: 0;
        }

        .board-container.collapsed,
        .matrix-container.collapsed {
            height: 0 !important;
            min-height: 0 !important;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
            border: none;
            margin: 0;
            flex-grow: 0;
            flex-shrink: 1;
        }

        .board-container {
            flex-grow: 0;
            display: flex;
            flex-direction: column;
        }

        .matrix-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }


        /* GARANTINDO SCROLL HORIZONTAL */
        .board {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding-bottom: 10px;
            overflow-x: auto;
            /* Permite scroll horizontal */
            min-height: 150px;
            cursor: grab;
            /* Cursor de mãozinha */
            /* CORREÇÃO VISUAL: Padding lateral para não cortar a primeira lista */
            padding-left: 8px;
            padding-right: 8px;
        }

        .board:active {
            cursor: grabbing;
        }

        .matrix {
            display: grid;
            /* AJUSTE DE PROPORÇÃO: Primeira coluna (labels laterais) */
            grid-template-columns: 40px 1fr 1fr;
            /* CORREÇÃO DE CORTE: Define altura mínima generosa para as linhas (250px) ao invés de 1fr puro
               Isso força o scroll a aparecer se a tela for pequena, garantindo que "Não Importante" apareça. */
            grid-template-rows: 40px minmax(250px, auto) minmax(250px, auto);
            gap: 12px;
            align-items: stretch;
            padding-top: 16px;
            min-height: 300px;
            flex-grow: 1;
            /* Remove height: 100% fixo para permitir que cresça e role */
            height: auto;
        }

        .matrix .list {
            align-self: stretch;
            min-height: 100px;
            /* AJUSTE: Remove largura fixa da lista quando dentro da matriz */
            width: auto !important;
            max-width: none !important;
            min-width: unset !important;
        }

        /* AJUSTE: Texto Justificado APENAS na matriz */
        .matrix .card .text {
            text-align: justify;
        }

        #agenda-sidebar {
            flex-basis: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: flex-basis .3s ease-in-out, min-width .3s ease-in-out, padding .3s ease-in-out, opacity .3s ease-in-out;
            min-width: 260px;
            position: relative;
        }

        .workspace.agenda-collapsed #agenda-sidebar {
            flex-basis: 0;
            min-width: 0;
            opacity: 0;
            padding: 0;
        }

        .toggle-tab {
            display: none;
        }

        .list {
            background: var(--panel);
            border: 1px solid #183453;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            width: 5cm;
            /* Largura fixa de 5cm NO KANBAN */
            min-width: 5cm;
            max-width: 5cm;
            flex-shrink: 0;
        }

        .list header {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #19375b;
            background: #122b4a;
            flex-shrink: 0;
        }

        .list header input.title {
            flex: 1;
            border: none;
            border-radius: 8px;
            padding: 6px 8px;
            background: #0e2542;
            color: var(--ink);
            min-width: 0;
        }

        /* Botão Minimalista de Adicionar Cartão */
        .list header .add-btn-minimal {
            background: transparent;
            border: 1px solid transparent;
            color: #9fc1ff;
            border-radius: 6px;
            padding: 0 6px;
            line-height: 20px;
            cursor: pointer;
            margin-left: auto;
            font-weight: bold;
            font-size: 16px;
        }

        .list header .add-btn-minimal:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Ajuste para ter dois botões à direita */
        .list header .more {
            margin-left: 4px;
            /* Pequeno espaço entre + e ... */
            background: transparent;
            border: 1px solid transparent;
            color: #9fc1ff;
            border-radius: 6px;
            padding: 0 6px;
            line-height: 20px;
            cursor: pointer;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            min-height: 34px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid #20486f;
            border-left: 8px solid transparent;
            border-radius: 8px;
            padding: 8px;
            cursor: grab;
            user-select: none;
            position: relative;
            transition: opacity .2s, transform .2s, box-shadow 0.2s;
        }

        /* ANIMAÇÕES DE TIMER */
        @keyframes pulse-orange {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 167, 38, 0.4);
                border-color: #ffa726;
            }

            50% {
                box-shadow: 0 0 0 4px rgba(255, 167, 38, 0.2);
                border-color: #ffb74d;
                background-color: #1a140a;
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 167, 38, 0);
                border-color: #ffa726;
            }
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 83, 80, 0.4);
                border-color: #ef5350;
            }

            50% {
                box-shadow: 0 0 0 6px rgba(239, 83, 80, 0.2);
                border-color: #ff867c;
                background-color: #2a0f0f;
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 83, 80, 0);
                border-color: #ef5350;
            }
        }

        .card.timer-running {
            animation: pulse-orange 2s infinite;
        }

        .card.timer-finished {
            animation: pulse-red 1s infinite;
        }

        .card.dragging {
            opacity: 0.5;
            transform: rotate(3deg)
        }

        .card.selected {
            outline: 2px solid #2a71ff;
            background: #0f2f57
        }

        .card.editing {
            background: #1a4b7f;
        }

        .card .text {
            white-space: pre-wrap;
            min-height: 1em;
            transition: opacity .2s, text-decoration .2s;
            word-break: break-word;
        }

        .card[data-completed="true"] .text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .meta {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-flex;
            border: 1px solid #375b86;
            position: relative;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .dot-check {
            display: none;
            color: #fff;
            font-weight: bold;
            font-size: 10px;
            line-height: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            user-select: none;
        }

        .card[data-completed="true"] .dot-check {
            display: block;
        }

        .timer-display {
            font-size: 11px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 4px;
            background: rgba(0, 0, 0, .2);
        }

        /* BARRA DE PROGRESSO DO TIMER */
        .timer-progress-container {
            height: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
            display: none;
            /* Escondido quando não há timer */
            width: 100%;
        }

        .timer-progress-bar {
            height: 100%;
            background: #66bb6a;
            width: 0%;
            transition: width 1s linear, background-color 0.3s;
        }

        .card.timer-running .timer-progress-container {
            display: block;
        }

        .card.timer-finished .timer-progress-bar {
            background: #ef5350;
            width: 100% !important;
        }

        .due-date {
            font-size: 11px;
            background: rgba(0, 0, 0, .2);
            padding: 1px 5px;
            border-radius: 4px;
        }

        .kebab {
            position: absolute;
            top: 2px;
            right: 2px;
            background: transparent;
            border: 1px solid transparent;
            color: #9fc1ff;
            border-radius: 6px;
            padding: 0 6px;
            line-height: 20px;
            cursor: pointer
        }

        .add {
            padding: 8px;
            border-top: 1px solid #19375b;
            flex-shrink: 0;
            display: none;
            /* ESCONDIDO POR PADRÃO - MINIMALISTA */
        }

        .add .row {
            display: flex;
            gap: 6px
        }

        .add input[type=text] {
            flex: 1;
            border: 1px solid #2a4e78;
            border-radius: 8px;
            padding: 8px;
            background: #0b2240;
            color: var(--ink);
            min-width: 0;
        }

        .axis {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #cfe0ff;
            background: #102b4f;
            border: 1px solid #1a4e78;
            border-radius: 10px;
            text-align: center;
        }

        .axis.corner {
            background: transparent;
            border: none
        }

        .axis.axis-y {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 4px 0;
            /* Garante que o label vertical ocupe toda a altura da célula e centralize */
            height: 100%;
            max-height: 100%;
            white-space: nowrap;
            /* Impede quebra de linha indesejada */
        }

        .quad-label {
            font-weight: 700;
            color: #cfe0ff;
            flex-grow: 1;
            /* Ocupa espaço para empurrar botões */
        }

        .list[data-type="quad"] {
            min-width: unset
        }

        .list[data-type="quad"][data-quad="Q1"] {
            background: #0f2f2a;
            border-color: #1e5b4e
        }

        .list[data-type="quad"][data-quad="Q1"] header {
            background: #104239
        }

        .list[data-type="quad"][data-quad="Q2"] {
            background: #0f243a;
            border-color: #1b4e84
        }

        .list[data-type="quad"][data-quad="Q2"] header {
            background: #0e3155
        }

        .list[data-type="quad"][data-quad="Q3"] {
            background: #3a290f;
            border-color: #7c5a19
        }

        .list[data-type="quad"][data-quad="Q3"] header {
            background: #5a4014
        }

        .list[data-type="quad"][data-quad="Q4"] {
            background: #3a0f12;
            border-color: #7c1920
        }

        .list[data-type="quad"][data-quad="Q4"] header {
            background: #5a1419
        }

        .schedule {
            background: var(--panel);
            border: 1px solid #183453;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .schedule header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px 10px;
            background: #0b437e;
            color: #fff;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px
        }

        .schedule .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        #slots {
            overflow-y: auto;
            flex-grow: 1;
        }

        .schedule header input[type=date] {
            background: #0b2240;
            color: #fff;
            border: 1px solid #2a4e78;
            border-radius: 8px;
            padding: 6px 8px;
            width: 120px;
        }

        .schedule header .agenda-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .schedule header .date-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .schedule header button {
            padding: 6px 10px;
            background: #0e58a5;
            border: none;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        .schedule header .date-nav button {
            padding: 4px 8px;
            font-size: 16px;
        }

        .schedule header .copy-paste-buttons button {
            font-size: 16px;
            padding: 6px 8px;
        }

        .slot {
            border-bottom: 1px dashed #244b78
        }

        .slot>div.head {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 4px
        }

        .slot .time {
            font-weight: 700;
            font-size: 11px;
            color: #9fc1ff;
            flex-grow: 1;
        }

        .slot .cards {
            display: none;
            padding: 4px;
            min-height: 28px
        }

        .slot.has-items .cards {
            display: block
        }

        .slot.hover {
            background: #0e2446;
            box-shadow: inset 0 0 0 2px #1976d2
        }

        .goal-slot {
            background: #1c3a61;
            border-bottom: 1px solid #3a6a9e;
        }

        .goal-slot>.head .goal-label {
            font-weight: bold;
            color: #ffd54f;
            flex-grow: 1;
        }

        /* Estilo para o slot de "Horário a definir" na agenda */
        .unscheduled-slot {
            background: #1a2333;
            border-bottom: 2px solid #b85d00;
            display: none;
            /* Escondido por padrão */
        }

        .unscheduled-slot.has-items {
            display: flex !important;
            /* Força display flex */
        }

        .unscheduled-slot>.head .unscheduled-label {
            font-weight: bold;
            color: #ff9800;
            /* Laranja para destaque */
            font-size: 12px;
            flex-grow: 1;
        }

        .placeholder {
            height: 38px;
            border: 2px dashed #1976d2;
            border-radius: 8px;
            background: #0e2446;
            margin: 4px 0
        }

        .ctx {
            position: fixed;
            background: #0b1220;
            color: #fff;
            border: 1px solid #24314a;
            border-radius: 8px;
            min-width: 240px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            display: none;
            z-index: 1000
        }

        .ctx button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #dbe7ff;
            padding: 10px 12px;
            border-radius: 0;
            cursor: pointer
        }

        .ctx button:hover {
            background: #1a2842
        }

        .ctx .shortcut {
            margin-left: auto;
            font-size: 0.8em;
            color: var(--muted);
            padding-left: 10px;
        }

        .ctx .sep {
            height: 1px;
            background: #23314a;
            margin: 6px 0
        }

        .ctx-sub {
            position: absolute;
            left: 100%;
            top: 0;
            background: #0b1220;
            color: #fff;
            border: 1px solid #24314a;
            border-radius: 8px;
            min-width: 240px;
            /* CORREÇÃO DE MENU: Altura máxima e Scroll */
            max-height: 60vh;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
            display: none
        }

        /* CORREÇÃO DE MENU: Vira para a esquerda se faltar espaço */
        .ctx-sub.flip-left {
            left: auto !important;
            right: 100% !important;
            border-right: 1px solid #24314a;
            border-left: none;
            margin-right: 2px;
        }

        .list header .more {
            margin-left: auto;
            background: transparent;
            border: 1px solid transparent;
            color: #9fc1ff;
            border-radius: 6px;
            padding: 0 6px;
            line-height: 20px;
            cursor: pointer
        }

        .modal-wrap {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999
        }

        .modal {
            background: #0b1220;
            color: #fff;
            border: 1px solid #24314a;
            border-radius: 12px;
            min-width: 280px;
            max-width: 94vw;
            padding: 14px 14px 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5)
        }

        .modal h3 {
            margin: 0 0 10px;
            font-size: 16px
        }

        .modal .row {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: flex-end
        }

        .modal .row button {
            background: #1976d2;
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 8px 10px;
            cursor: pointer
        }

        .modal .row button.cancel {
            background: #6b7a93
        }

        .import-options button {
            margin: 5px;
            flex-grow: 1;
        }

        .palette-editor {
            display: none;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .palette-editor.editing {
            display: flex;
        }

        .palette-grid.editing {
            display: none;
        }

        .palette-editor-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .palette-editor-swatch {
            width: 24px;
            height: 24px;

                if (!isFirebaseReady || !uid) return;

                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

                }
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = { contents: [{ parts: [{ text: prompt }] }] };

                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) return text;
                        else throw new Error('Resposta da API inválida ou vazia.');
                    } catch (error) {
                        if (i === retries - 1) {
                            console.error("Erro final ao chamar a API Gemini:", error);
                            throw error;
                        }
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    }
                }
            }

            async function generateSubtasks(block) {
                if (!block || !block.length) return;
                showLoader('✨ Gerando subtarefas com a IA...');
                try {
                    for (const card of block) {
                        const originalText = card.querySelector('.text').textContent;
                        const prompt = `Aja como um assistente de produtividade. Quebre a seguinte tarefa em 3 a 5 subtarefas menores e acionáveis. Responda com uma lista de subtarefas, uma por linha. Não adicione nenhum outro texto, cabeçalhos, marcadores ou formatação. Tarefa: "${originalText}"`;
                        const resultText = await callGemini(prompt);
                        const subtasks = resultText.split('\n').map(s => s.trim()).filter(Boolean);
                        if (subtasks.length > 0) {
                            let lastCard = card;
                            subtasks.forEach(taskText => {
                                const newCard = createCard({ text: "・ " + taskText, color: card.dataset.color, due: card.dataset.due });
                                if (!card.closest('#agenda-sidebar')) {
                                    lastCard.parentElement.insertBefore(newCard, lastCard.nextSibling);
                                    lastCard = newCard;
                                }
                            });
                        } else { throw new Error('Nenhuma subtarefa foi gerada.'); }
                    }
                    updateSlotsHasItems();
                    persist();
                    updateTotalTimerDisplay();
                } catch (error) {
                    // Erro já tratado no catch do callGemini se for falta de key
                } finally {
                    hideLoader();
                }
            }

            async function organizeCardWithGemini(block) {
                if (!block || !block.length || !matrixEl) return;
                showLoader('✨ Analisando tarefa com IA...');
                const quadToColor = { Q1: MATRIX_COLORS.Q1, Q2: MATRIX_COLORS.Q2, Q3: MATRIX_COLORS.Q3, Q4: MATRIX_COLORS.Q4 };
                try {
                    for (const card of block) {
                        const originalText = card.querySelector('.text').textContent;
                        const prompt = `Aja como um especialista em produtividade usando a Matriz de Eisenhower. Analise a seguinte tarefa e decida em qual quadrante ela se encaixa: Q1 (Urgente e Importante), Q2 (Não Urgente e Importante), Q3 (Urgente e Não Importante), ou Q4 (Não Urgente e Não Importante). Responda APENAS com "Q1", "Q2", "Q3", ou "Q4". Tarefa: "${originalText}"`;
                        const resultQuad = (await callGemini(prompt)).trim().toUpperCase();
                        if (quadToColor[resultQuad]) {

                                dest.appendChild(card);
                                card.dataset.color = quadToColor[resultQuad];
                                paintCard(card);

                    }
                    updateSlotsHasItems();
                    persist();
                    updateTotalTimerDisplay();
                } catch (error) {
                    // Erro já tratado
                } finally {
                    hideLoader();
                }
            }

            // EVENTO DE SINCRONIZAÇÃO ENTRE ABAS (LOCAL)
            window.addEventListener('storage', function (e) {
                if (e.key === LS_BOARD_PREFIX + currentBoardId || e.key === LS_GLOBAL_AGENDA) {
                    // Se mudou o quadro atual OU a agenda global
                    console.log("Sync: Aba local atualizada via localStorage");
                    isRemoteUpdate = true;
                    loadAndRenderAll();
                    isRemoteUpdate = false;
                }
                else if (e.key === LS_BOARDS_META) {
                    loadBoardsMetadata();
                    updateBoardSelectUI();
                }
                else if (e.key === LS_CURRENT_BOARD) {

                }
            });

            document.addEventListener('mousemove', (e) => {
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            function updateTotalTimerDisplay() {
                let selectedSeconds = 0;
                let visibleSeconds = 0;
                let totalSecondsAll = 0;
                if (selected.size > 0) {
                    selected.forEach(card => {
                        selectedSeconds += parseInt(card.dataset.timerTotal || '0', 10);
                    });
                }
                allCards.forEach(card => {
                    const cardTime = parseInt(card.dataset.timerTotal || '0', 10);
                    totalSecondsAll += cardTime;
                    const style = window.getComputedStyle(card);
                    if (style.display !== 'none' && style.visibility !== 'hidden') {
                        if (card.offsetParent !== null) {
                            visibleSeconds += cardTime;
                        }
                    }
                });
                const displayText = selected.size > 0 ? formatSecondsToTime(selectedSeconds) : formatSecondsToTime(visibleSeconds);
                if (sumTimersDisplay) {
                    sumTimersDisplay.textContent = displayText;
                    sumTimersDisplay.title = `Selecionado: ${formatSecondsToTime(selectedSeconds)} / Filtrado: ${formatSecondsToTime(visibleSeconds)} / Total: ${formatSecondsToTime(totalSecondsAll)}`;
                }
            }

            function cardToData(c) {
                var t = c.querySelector('.text');
                return {
                    text: (t ? t.textContent : '').trim(),
                    color: c.dataset.color || '',
                    due: c.dataset.due || '',
                    when: c.dataset.when || '',
                    timerTotal: c.dataset.timerTotal || '',
                    timerLeft: c.dataset.timerLeft || '',
                    timerState: c.dataset.timerState || '',
                    timerEnd: c.dataset.timerEnd || '',
                    completed: c.dataset.completed || 'false',
                    history: c.dataset.history || '[]'
                };
            }

            function addCardHistory(card, actionText) {
                let hist = [];
                try { hist = JSON.parse(card.dataset.history || '[]'); } catch(e) {}
                hist.push({ action: actionText, time: Date.now() });
                card.dataset.history = JSON.stringify(hist);
            }

            // FUNÇÃO IMPORTANTE: Separa o que é do Quadro do que é da Agenda Global
            function serializeAndSeparate() {
                var boardData = [];
                var agendaData = [];

                // 1. Kanban Lists (Sempre do Quadro)
                $$('.list[data-type="kanban"]', boardEl).forEach(function (l) {
                    const title = l.querySelector('.title').value;
                    const cardsInList = $$('.card', l).map(c => allCards.find(cacheCard => cacheCard === c)).filter(Boolean).map(cardToData);
                    boardData.push({ type: 'kanban', title: title, cards: cardsInList });
                });

                // 2. Matrix Lists (Sempre do Quadro)
                if (matrixEl) {
                    $$('.list[data-type="quad"]', matrixEl).forEach(function (l) {
                        const quad = l.dataset.quad;
                        const cardsInList = $$('.card', l).map(c => allCards.find(cacheCard => cacheCard === c)).filter(Boolean).map(cardToData);
                        boardData.push({ type: 'quad', quad: quad, cards: cardsInList });
                    });
                }

                // 3. Agenda & Objetivos & Unscheduled (Sempre Global)
                // Vamos procurar em allCards tudo que tem 'when' definido
                // Isso pega tanto o que está nos slots visuais quanto o que pode ter se perdido
                const globalCards = allCards.filter(c => c.dataset.when && c.dataset.when.length > 0);

                // Agrupar para salvar bonito, mas na real salvamos uma lista flat de "scheduled items" seria melhor.
                // Mas para manter compatibilidade com a estrutura antiga:

                // Goal
                const goalCards = globalCards.filter(c => c.dataset.when.endsWith('TGOAL')).map(cardToData);
                if (goalCards.length > 0) agendaData.push({ type: 'goal', goal: true, cards: goalCards });

                // Time Slots
                const timeCardsMap = {};
                globalCards.filter(c => /T\d{2}:\d{2}$/.test(c.dataset.when)).forEach(c => {
                    const time = c.dataset.when.substring(11); // Pega HH:MM
                    if (!timeCardsMap[time]) timeCardsMap[time] = [];
                    timeCardsMap[time].push(cardToData(c));
                });
                for (const t in timeCardsMap) {
                    agendaData.push({ type: 'time', time: t, cards: timeCardsMap[t] });
                }

                // Unscheduled (A definir)
                const unscheduledCards = globalCards.filter(c => c.dataset.when.endsWith('T')).map(cardToData);
                if (unscheduledCards.length > 0) {
                    agendaData.push({ type: 'unscheduled', cards: unscheduledCards });
                }

                return { boardData, agendaData };
            }

            var HIST_LIMIT = 120; var hist = [], cursor = -1;
            function pushHistory(snap) {
                // Snap agora é um objeto { boardData, agendaData }
                hist = hist.slice(0, cursor + 1); hist.push(snap);
                if (hist.length > HIST_LIMIT) { hist.shift(); } cursor = hist.length - 1; updateUndoUi();
            }
            function capture() {
                if (__muteHistory > 0) return;
                try { pushHistory(serializeAndSeparate()); } catch (e) { }
            }
            function canUndo() { return cursor > 0; }
            function canRedo() { return cursor >= 0 && cursor < hist.length - 1; }
            function updateUndoUi() {
                const undoBtn = document.getElementById('undo');
                const redoBtn = document.getElementById('redo');
                if (undoBtn) undoBtn.disabled = !canUndo();
                if (redoBtn) redoBtn.disabled = !canRedo();
            }
            function doUndo() { if (!canUndo()) return; withMute(function () { cursor--; restore(hist[cursor]); }); updateUndoUi(); }
            function doRedo() { if (!canRedo()) return; withMute(function () { cursor++; restore(hist[cursor]); }); updateUndoUi(); }

            // Função unificada para carregar tudo
            function loadAndRenderAll() {
                let boardData = [];
                let agendaData = [];

                try {
                    const bStr = localStorage.getItem(LS_BOARD_PREFIX + currentBoardId);
                    if (bStr) boardData = JSON.parse(bStr);
                } catch (e) { console.error("Erro load board", e); }

                try {
                    const aStr = localStorage.getItem(LS_GLOBAL_AGENDA);
                    if (aStr) agendaData = JSON.parse(aStr);
                } catch (e) { console.error("Erro load agenda", e); }

                // Se for a primeira vez e não tiver agenda global, tenta migrar dados da agenda que estavam no board
                // (Isso previne perda de dados ao atualizar o código)
                if (agendaData.length === 0 && boardData.some(d => d.type === 'time' || d.type === 'goal' || d.type === 'unscheduled')) {
                    console.log("Migrando agenda do quadro para global...");
                    agendaData = boardData.filter(d => d.type === 'time' || d.type === 'goal' || d.type === 'unscheduled');
                    boardData = boardData.filter(d => d.type === 'kanban' || d.type === 'quad');
                    // Salva a migração
                    localStorage.setItem(LS_BOARD_PREFIX + currentBoardId, JSON.stringify(boardData));
                    localStorage.setItem(LS_GLOBAL_AGENDA, JSON.stringify(agendaData));
                }

                renderFromData(boardData, agendaData);
            }

            function renderFromData(boardData, agendaData) {
                // Junta os dois para renderizar, mas a lógica interna sabe que vieram de lugares diferentes
                // Na verdade, a função original renderFromData aceitava um array único.
                // Vamos concatenar para reusar a lógica de renderização, pois visualmente é tudo card.
                const allData = (boardData || []).concat(agendaData || []);

                // === PRESERVAR SCROLL ===
                const scrollMap = new Map();
                scrollMap.set(boardEl, { left: boardEl.scrollLeft, top: boardEl.scrollTop });
                const mainContent = document.getElementById('main-content');
                if (mainContent) scrollMap.set(mainContent, { left: mainContent.scrollLeft, top: mainContent.scrollTop });
                const slots = document.getElementById('slots');
                if (slots) scrollMap.set(slots, { left: slots.scrollLeft, top: slots.scrollTop });
                if (matrixEl) scrollMap.set(matrixEl, { left: matrixEl.scrollLeft, top: matrixEl.scrollTop });

                allCards = [];
                boardEl.innerHTML = '';
                matrixEl.innerHTML = '';
                slotsRoot.innerHTML = '';

                ensureMatrix();
                ensureSchedule(false);

                var quadMap = {
                    Q1: matrixEl.querySelector('.list[data-quad="Q1"] .cards'),
                    Q2: matrixEl.querySelector('.list[data-quad="Q2"] .cards'),
                    Q3: matrixEl.querySelector('.list[data-quad="Q3"] .cards'),
                    Q4: matrixEl.querySelector('.list[data-quad="Q4"] .cards')
                };

                function appendCardsToDOM(container, cardsData) {
                    if (!container || !cardsData || !cardsData.length) return;
                    var fragment = document.createDocumentFragment();
                    cardsData.forEach(function (cd) {
                        const cardEl = createCard(cd);
                        fragment.appendChild(cardEl);
                    });
                    container.appendChild(fragment);
                }

                allData.forEach(function (entry) {
                    if (entry.type === 'kanban') {
                        var l = createList(entry.title || 'Lista');
                        appendCardsToDOM(l.querySelector('.cards'), entry.cards);
                    } else if (entry.type === 'quad' && quadMap[entry.quad]) {
                        appendCardsToDOM(quadMap[entry.quad], entry.cards);
                    } else if (entry.type === 'time' || entry.type === 'goal') {
                        (entry.cards || []).forEach(cardData => {
                            if (entry.goal && cardData.when && !cardData.when.endsWith('TGOAL')) {
                                cardData.when = (cardData.when.split('T')[0] || getActiveDay()) + 'TGOAL';
                            } else if (entry.time && cardData.when && !cardData.when.includes('T' + entry.time)) {
                                cardData.when = (cardData.when.split('T')[0] || getActiveDay()) + 'T' + entry.time;
                            }
                            createCard(cardData);
                        });
                    } else if (entry.type === 'unscheduled') {
                        (entry.cards || []).forEach(cardData => {
                            createCard(cardData);
                        });
                    }
                });

                applyFilters();
                updateSlotsHasItems();
                updateTotalTimerDisplay();

                if (globalTimerInterval) {
                    clearInterval(globalTimerInterval);
                    globalTimerInterval = null;
                }
                startGlobalTimer();

                scrollMap.forEach((pos, element) => {
                    if (element) {
                        element.scrollLeft = pos.left;
                        element.scrollTop = pos.top;
                    }
                });
            }

            function restore(histObj) {
                // histObj tem { boardData, agendaData }
                if (histObj && histObj.boardData) {
                    renderFromData(histObj.boardData, histObj.agendaData);
                    persist(); // Salva o estado restaurado
                } else {
                    // Fallback para formato antigo de historico se existir
                    renderFromData(histObj, []);
                }
            }

            // ===== BOARD MANAGEMENT CORE =====
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            function loadBoardsMetadata() {
                try {
                    const raw = localStorage.getItem(LS_BOARDS_META);
                    boardsMeta = raw ? JSON.parse(raw) : [];
                } catch (e) { boardsMeta = []; }
            }

            function saveBoardsMetadata(syncToCloud = true) {
                localStorage.setItem(LS_BOARDS_META, JSON.stringify(boardsMeta));
                updateBoardSelectUI();

                // Sync metadata to Firebase
                if (syncToCloud && isFirebaseReady && auth && auth.currentUser) {
                    db.ref('users/' + auth.currentUser.uid + '/meta').set(boardsMeta)
                        .catch(e => console.error("Erro ao salvar metadata na nuvem", e));
                }
            }

            function ensureTrashBoard() {
                if (!boardsMeta.find(b => b.id === 'board-trash')) {
                    boardsMeta.push({ id: 'board-trash', name: 'Lixeira 🗑️', lastModified: Date.now(), color: '#5a1419' });
                    localStorage.setItem(LS_BOARD_PREFIX + 'board-trash', JSON.stringify([{ type: 'kanban', title: 'Apagados', cards: [] }]));
                    saveBoardsMetadata(true);
                }
            }

            function migrateToMultiBoard() {
                const legacyData = localStorage.getItem(LS_KEY);
                const hasMetadata = localStorage.getItem(LS_BOARDS_META);

                if (legacyData && !hasMetadata) {
                    console.log("Migrando para multi-board...");
                    const newId = generateId();
                    const mainBoard = { id: newId, name: 'Quadro Principal', lastModified: Date.now(), color: DEFAULT_THEME_COLOR };
                    boardsMeta = [mainBoard];
                    ensureTrashBoard();

                    // Tenta separar o que é agenda do que é quadro na migração inicial
                    // (Simplificado: joga tudo no quadro primeiro, o loadAndRenderAll separa depois)
                    localStorage.setItem(LS_BOARD_PREFIX + newId, legacyData);

                    currentBoardId = newId;
                    localStorage.setItem(LS_CURRENT_BOARD, currentBoardId);
                    saveBoardsMetadata();
                } else if (!hasMetadata) {
                    createNewBoard('Meu Quadro');
                    ensureTrashBoard();
                } else {
                    loadBoardsMetadata();
                    ensureTrashBoard();
                    currentBoardId = localStorage.getItem(LS_CURRENT_BOARD);
                    if (!boardsMeta.find(b => b.id === currentBoardId)) {
                        if (boardsMeta.length > 0) currentBoardId = boardsMeta[0].id;
                        else createNewBoard('Meu Quadro');
                    }
                }
            }

            function createNewBoard(name) {
                const id = generateId();
                const newBoard = { id: id, name: name || 'Novo Quadro', lastModified: Date.now(), color: DEFAULT_THEME_COLOR };
                boardsMeta.push(newBoard);
                saveBoardsMetadata();
                localStorage.setItem(LS_BOARD_PREFIX + id, JSON.stringify([]));
                switchBoard(id);
            }

            function renameBoard() {
                const board = boardsMeta.find(b => b.id === currentBoardId);
                if (!board) return;
                const newName = prompt("Novo nome para o quadro:", board.name);
                if (newName && newName.trim()) {
                    board.name = newName.trim();
                    saveBoardsMetadata();
                }
            }

            function deleteBoard() {
                if (boardsMeta.length <= 1) {
                    alert("Você não pode excluir o único quadro existente.");
                    return;
                }
                const board = boardsMeta.find(b => b.id === currentBoardId);
                if (!board) return;

                if (confirm(`Tem certeza que deseja excluir o quadro "${board.name}"? Isso não pode ser desfeito.`)) {
                    localStorage.removeItem(LS_BOARD_PREFIX + currentBoardId);
                    if (isFirebaseReady && auth && auth.currentUser) {
                        db.ref('users/' + auth.currentUser.uid + '/boards/' + currentBoardId).remove();
                    }
                    boardsMeta = boardsMeta.filter(b => b.id !== currentBoardId);
                    currentBoardId = boardsMeta[0].id;
                    saveBoardsMetadata();
                    localStorage.setItem(LS_CURRENT_BOARD, currentBoardId);
                    window.location.reload();
                }
            }

            function cloneBoard() {
                const board = boardsMeta.find(b => b.id === currentBoardId);
                if (!board) return;
                const newName = prompt("Nome para a cópia:", board.name + " (Cópia)");
                if (!newName) return;

                // Na cópia, pegamos APENAS os dados do quadro, não a agenda (que é global)
                const { boardData } = serializeAndSeparate();
                const newId = generateId();

                const newBoard = { id: newId, name: newName, lastModified: Date.now(), color: board.color || DEFAULT_THEME_COLOR };
                boardsMeta.push(newBoard);
                saveBoardsMetadata();

                localStorage.setItem(LS_BOARD_PREFIX + newId, JSON.stringify(boardData));
                switchBoard(newId);
            }

            function switchBoard(id) {
                if (id === currentBoardId && boardEl.children.length > 0) return;

                console.log("Switching to board: " + id);
                currentBoardId = id;
                localStorage.setItem(LS_CURRENT_BOARD, id);

                const board = boardsMeta.find(b => b.id === id);
                if (board) setBoardTheme(board.color);

                loadAndRenderAll();

                // Reinicia historico de undo
                hist = []; cursor = -1;
                const { boardData, agendaData } = serializeAndSeparate();
                pushHistory({ boardData, agendaData });

                updateBoardSelectUI();

                if (isFirebaseReady && auth && auth.currentUser) {
                    subscribeToCurrentBoard(auth.currentUser.uid, id);
                }

            // ===== THEMES & CROSS-BOARD =====
            // ... (THEMES code remains same) ...
            const THEMES = {
                '#1976d2': { name: 'Azul (Padrão)', brand: '#1976d2', bg: '#0f1a2a', panel: '#0f223d', card: '#112b4a', text: '#e9f1ff' },
                '#2e7d32': { name: 'Verde Floresta', brand: '#2e7d32', bg: '#0b160b', panel: '#142517', card: '#1a321e', text: '#e8f5e9' },
                '#7b1fa2': { name: 'Roxo Profundo', brand: '#7b1fa2', bg: '#100614', panel: '#210e29', card: '#2c1236', text: '#f3e5f5' },
                '#e65100': { name: 'Laranja Queimado', brand: '#e65100', bg: '#180d00', panel: '#2e1900', card: '#3d2200', text: '#fff3e0' },
                '#c62828': { name: 'Vermelho Tijolo', brand: '#c62828', bg: '#140505', panel: '#2a0a0a', card: '#380d0d', text: '#ffebee' },
                '#37474f': { name: 'Cinza Escuro', brand: '#37474f', bg: '#101416', panel: '#1c2327', card: '#263238', text: '#eceff1' },
                '#00838f': { name: 'Ciano', brand: '#00838f', bg: '#001416', panel: '#00262b', card: '#003339', text: '#e0f7fa' },

            function setBoardTheme(color) {
                const r = document.querySelector(':root');
                const safeColor = color || DEFAULT_THEME_COLOR;
                const theme = THEMES[safeColor] || THEMES[DEFAULT_THEME_COLOR];

                if (theme) {
                    r.style.setProperty('--brand', theme.brand);
                    r.style.setProperty('--bg', theme.bg);
                    r.style.setProperty('--panel', theme.panel);
                    r.style.setProperty('--card', theme.card);
                    r.style.setProperty('--ink', theme.text);
                } else {
                    r.style.setProperty('--brand', safeColor);
                    r.style.setProperty('--bg', '#0f1a2a');
                    r.style.setProperty('--panel', '#0f223d');
                    r.style.setProperty('--card', '#112b4a');
                    r.style.setProperty('--ink', '#e9f1ff');

            // (getBoardData removido pois não é mais usado da mesma forma, substituido por loadAndRenderAll)
            function getBoardData(boardId) {

                try {
                    const str = localStorage.getItem(LS_BOARD_PREFIX + boardId);

            function moveCardToBoard(cardElement, targetBoardId, targetListTitle) {
                if (!cardElement) return;

                const targetBoardMeta = boardsMeta.find(b => b.id === targetBoardId);
                const boardName = targetBoardMeta ? targetBoardMeta.name : 'Outro Quadro';
                addCardHistory(cardElement, 'Movido para o quadro "' + boardName + '"');

            function initDemo() {
                withMute(function () {
                    var toDo = createList('Para Fazer');
                    toDo.querySelector('.cards').appendChild(createCard({ text: 'Tarefa importante e urgente', color: '#104239', timerTotal: '1800' }));
                    createList('Em Andamento'); createList('Feito');
                    if (matrixEl) { var q1 = matrixEl.querySelector('.list[data-quad="Q1"] .cards'); q1.appendChild(createCard({ text: 'Crise: Resolver problema no servidor!', color: '#104239', timerTotal: '7200' })); }
                    createCard({ text: "Definir meta principal do dia", when: `${getActiveDay()}TGOAL`, timerTotal: '900' });
                });
                applyFilters(); updateSlotsHasItems(); updateTotalTimerDisplay();
            }

            function updateFocusMode() {
                if (window.innerWidth < 700) {
                    const runningCard = document.querySelector('.card.timer-running, .card.timer-finished');
                    if (runningCard) {
                        document.body.classList.add('focus-mode');
                        const text = runningCard.querySelector('.text').textContent;
                        const disp = runningCard.querySelector('.timer-display');
                        document.getElementById('focusTargetText').textContent = text;
                        document.getElementById('focusTargetTime').textContent = disp ? disp.textContent.replace('⏱️ ', '').replace(' min', '') : '...';
                        return;
                    }
                }
                document.body.classList.remove('focus-mode');
            }
            window.addEventListener('resize', updateFocusMode);

            function initApp() {
                applyDragScroll();
                loadState();
                migrateToMultiBoard();
                if (currentBoardId) { switchBoard(currentBoardId); } else { ensureMatrix(); ensureSchedule(false); initDemo(); }
            }

            initApp();
        });
    </script>
</body>

</html>
