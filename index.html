<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- CORREÇÃO DE SEGURANÇA E CONEXÃO -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src * self blob: data: gap:; style-src * self 'unsafe-inline' blob: data: gap:; script-src * 'self' 'unsafe-eval' 'unsafe-inline' blob: data: gap:; object-src * 'self' blob: data: gap:; img-src * self 'unsafe-inline' blob: data: gap:; connect-src self * 'unsafe-inline' blob: data: gap:; frame-src * self blob: data: gap:;">

    <title>TEA PLANNER (Sync Final Fix)</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

        <style>
        :root {
            --bg: #0f1a2a;
            --panel: #0f223d;
            --ink: #e9f1ff;
            --brand: #1976d2;
            --muted: #9fb3d2;
            --card: #112b4a
        }

        .alert-option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #0d1e36;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-size: 14px;
        }
        .alert-option-item:hover {
            background: #152c4e;
            border-color: rgba(255, 255, 255, 0.25);
        }
        .alert-option-item.selected {
            background: rgba(25, 118, 210, 0.15);
            border-color: #1976d2;
        }
        .alert-option-item .check-mark {
            display: none;
            color: #1976d2;
            font-weight: bold;
        }
        .alert-option-item.selected .check-mark {
            display: inline;
        }

        #main-content.matrix-collapsed #board-container {
            height: 100% !important;
            flex: 1 1 auto !important;
        }
        #main-content.board-collapsed #matrix-container {
            height: 100% !important;
            flex: 1 1 auto !important;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        header.app {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            background: var(--brand);
            color: var(--header-text);
            flex-wrap: wrap;
            transition: background-color .3s;
            flex-shrink: 0;
        }

        header.app.filters-active {
            background: #b85d00 !important;
            color: #ffffff !important;
        }

        header.app h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            margin-right: auto;
            display: flex;
            align-items: center;
        }

        .header-icon {
            width: 22px;
            height: 22px;
            stroke: var(--header-text);
            vertical-align: -4px;
            margin-right: 8px;
        }

        header.app input,
        header.app button,
        header.app select {
            border: 1px solid var(--header-btn-border);
            border-radius: 8px;
            padding: 6px 10px;
            background: var(--header-btn-bg);
            color: var(--header-text);
            transition: background-color 0.2s, border-color 0.2s;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        header.app button,
        header.app select {
            cursor: pointer;
        }

        header.app button:hover,
        header.app select:hover {
            background: var(--header-btn-hover);
            border-color: var(--header-btn-hover-border);
        }

        header.app button.active {
            background: #ffd54f !important;
            color: #10243a !important;
            border-color: #ffd54f !important;
        }

        #boardSelect {
            max-width: 200px;
            font-weight: 600;
        }

        #boardSelect option {
            background: var(--panel) !important;
            color: var(--ink) !important;
        }

        #loginBtn {
            font-weight: 600;
            transition: all 0.2s;
        }

        #loginBtn.logged-in {
            background: var(--header-btn-bg) !important;
            color: var(--header-text) !important;
            border-color: var(--header-btn-border) !important;
        }

        #loginBtn.logged-in:hover {
            background: var(--header-btn-hover) !important;
            border-color: var(--header-btn-hover-border) !important;
        }

        #sumTimersDisplay {
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 6px;
            margin-left: 5px;
            margin-right: 5px;
            cursor: help;
        }

        .badge {
            display: inline-block;
            background: #ffd54f;
            color: #10243a;
            font-weight: 700;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            border: 1px solid rgba(0, 0, 0, .15)
        }

        .badge[hidden] {
            display: none !important
        }

        /* Toggle Switch styles */
        .toggle-switch {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .toggle-switch-input {
            display: none;
        }

        .toggle-switch-label {
            font-size: 16px;
            user-select: none;
        }

        .toggle-switch-input:checked+.toggle-switch-label {
            color: #ffd54f;
        }

        .toggle-switch-input:checked+.toggle-switch-label+.toggle-switch-button {
            background: #ffd54f;
        }

        .toggle-switch-button {
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 6px;
            background: var(--header-btn-bg);
            color: var(--header-text);
            transition: background .2s;
        }

        .workspace {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 58px);
            padding: 12px;
            gap: 12px;
            transition: gap .3s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-width: 0;
            position: relative;
            transition: flex .3s ease-in-out, width .3s ease-in-out, min-width .3s ease-in-out, opacity .3s ease-in-out;
            width: 100%;
            /* CURSOR MUDADO PARA INDICAR QUE PODE ARRASTAR */
            cursor: grab;
        }

        /* Quando estiver arrastando */
        #main-content:active {
            cursor: grabbing;
        }

        #main-content.collapsed {
            flex: 0 0 0px;
            min-width: 0;
            opacity: 0;
            padding: 0;
            overflow: hidden;
        }

        .board-container,
        .matrix-container {
            position: relative;
            transition: height .3s ease-in-out, min-height .3s ease-in-out, opacity .3s ease-in-out, padding .3s ease-in-out, flex-grow .3s ease-in-out, flex-shrink .3s ease-in-out;
            overflow: hidden;
            flex-shrink: 0;
        }

        .board-container.collapsed,
        .matrix-container.collapsed {
            height: 0 !important;
            min-height: 0 !important;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
            border: none;
            margin: 0;
            flex-grow: 0;
            flex-shrink: 1;
        }

        .board-container {
            flex-grow: 0;
            display: flex;
            flex-direction: column;
        }

        .matrix-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }


        /* GARANTINDO SCROLL HORIZONTAL */
        .board {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding-bottom: 10px;
            overflow-x: auto;
            /* Permite scroll horizontal */
            min-height: 150px;
            cursor: grab;
            /* Cursor de mãozinha */
            /* CORREÇÃO VISUAL: Padding lateral para não cortar a primeira lista */
            padding-left: 8px;
            padding-right: 8px;
        }

        .board:active {
            cursor: grabbing;
        }

        .matrix {
            display: grid;
            /* AJUSTE DE PROPORÇÃO: Primeira coluna (labels laterais) */
            grid-template-columns: 40px 1fr 1fr;
            /* CORREÇÃO DE CORTE: Define altura mínima generosa para as linhas (250px) ao invés de 1fr puro
               Isso força o scroll a aparecer se a tela for pequena, garantindo que "Não Importante" apareça. */
            grid-template-rows: 40px minmax(250px, auto) minmax(250px, auto);
            gap: 12px;
            align-items: stretch;
            padding-top: 16px;
            min-height: 300px;
            flex-grow: 1;
            /* Remove height: 100% fixo para permitir que cresça e role */
            height: auto;
        }

        .matrix .list {
            align-self: stretch;
            min-height: 100px;
            /* AJUSTE: Remove largura fixa da lista quando dentro da matriz */
            width: auto !important;
            max-width: none !important;
            min-width: unset !important;
        }

        /* AJUSTE: Texto Justificado APENAS na matriz */
        .matrix .card .text {
            text-align: justify;
        }

        #agenda-sidebar {
            flex-basis: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: flex-basis .3s ease-in-out, min-width .3s ease-in-out, padding .3s ease-in-out, opacity .3s ease-in-out;
            min-width: 260px;
            position: relative;
        }

        .workspace.agenda-collapsed #agenda-sidebar {
            flex-basis: 0 !important;
            min-width: 0 !important;
            opacity: 0 !important;
            padding: 0 !important;
            border: none !important;
            margin: 0 !important;
            width: 0 !important;
            overflow: hidden !important;
        }

        .toggle-tab {
            display: none;
        }

        .list {
            background: var(--panel);
            border: 1px solid #183453;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            width: 5cm;
            /* Largura fixa de 5cm NO KANBAN */
            min-width: 5cm;
            max-width: 5cm;
            flex-shrink: 0;
        }

        .list header {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--card);
            flex-shrink: 0;
        }

        .list header input.title {
            flex: 1;
            border: none;
            border-radius: 8px;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.2);
            color: var(--ink);
            min-width: 0;
        }

        /* Botão Minimalista de Adicionar Cartão */
        .list header .add-btn-minimal {
            background: transparent;
            border: 1px solid transparent;
            color: #9fc1ff;
            border-radius: 6px;
            padding: 0 6px;
            line-height: 20px;
            cursor: pointer;
            margin-left: auto;
            font-weight: bold;
            font-size: 16px;
        }

        .list header .add-btn-minimal:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Ajuste para ter dois botões à direita */
        .list header .more {
            margin-left: 4px;
            /* Pequeno espaço entre + e ... */
            background: transparent;
            border: 1px solid transparent;
            color: #9fc1ff;
            border-radius: 6px;
            padding: 0 6px;
            line-height: 20px;
            cursor: pointer;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            min-height: 34px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 6px solid var(--board-color, transparent);
            border-radius: 8px;
            padding: 0;
            cursor: grab;
            user-select: none;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: opacity .2s, transform .2s, box-shadow 0.2s;
        }

        .card-header {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            background: var(--label-color, rgba(0, 0, 0, 0.25));
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            gap: 6px;
            color: #fff;
            transition: background-color 0.3s;
        }

        .card-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* ANIMAÇÕES DE TIMER */
        @keyframes pulse-orange {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 167, 38, 0.4);
                border-color: #ffa726;
            }

            50% {
                box-shadow: 0 0 0 4px rgba(255, 167, 38, 0.2);
                border-color: #ffb74d;
                background-color: #1a140a;
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 167, 38, 0);
                border-color: #ffa726;
            }
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 83, 80, 0.4);
                border-color: #ef5350;
            }

            50% {
                box-shadow: 0 0 0 6px rgba(239, 83, 80, 0.2);
                border-color: #ff867c;
                background-color: #2a0f0f;
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 83, 80, 0);
                border-color: #ef5350;
            }
        }

        .card.timer-running {
            animation: pulse-orange 2s infinite;
        }

        .card.timer-finished {
            animation: pulse-red 1s infinite;
        }

        .card.dragging {
            opacity: 0.5;
            transform: rotate(3deg)
        }

        .card.selected {
            outline: 2px solid #2a71ff;
            background: #0f2f57
        }

        .card.editing {
            background: #1a4b7f;
        }

        .card .text {
            white-space: pre-wrap;
            min-height: 1em;
            transition: opacity .2s, text-decoration .2s;
            word-break: break-word;
        }

        .card[data-completed="true"] .text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .meta {
            display: none; /* Substituted by card-header */
        }

        .card-checkbox-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-flex;
            border: 1.5px solid var(--board-color, #375b86);
            position: relative;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }

        .dot-check {
            display: none;
            color: #fff;
            font-weight: bold;
            font-size: 10px;
            line-height: 1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            user-select: none;
        }

        .card[data-completed="true"] .dot-check {
            display: block;
        }

        .timer-display {
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, .25);
            color: #cfe0ff;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        /* BARRA DE PROGRESSO DO TIMER */
        .timer-progress-container {
            height: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
            overflow: hidden;
            display: none;
            /* Escondido quando não há timer */
            width: 100%;
            cursor: pointer;
        }

        .timer-progress-bar {
            height: 100%;
            background: #66bb6a;
            width: 0%;
            transition: width 1s linear, background-color 0.3s;
        }

        .card.timer-running .timer-progress-container {
            display: block;
        }

        .card.timer-finished .timer-progress-bar {
            background: #ef5350;
            width: 100% !important;
        }

        .due-date {
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, .25);
            color: #cfe0ff;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .kebab {
            background: transparent;
            border: none;
            color: #9fc1ff;
            border-radius: 4px;
            padding: 0 4px;
            line-height: 1;
            font-size: 12px;
            height: 16px;
            cursor: pointer;
            margin-left: auto; /* Push it to the far right of the flex header */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .kebab:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .add {
            padding: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            display: none;
            /* ESCONDIDO POR PADRÃO - MINIMALISTA */
        }

        .add .row {
            display: flex;
            gap: 6px
        }

        .add input[type=text] {
            flex: 1;
            border: 1px solid #2a4e78;
            border-radius: 8px;
            padding: 8px;
            background: #0b2240;
            color: var(--ink);
            min-width: 0;
        }

        .axis {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--ink);
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            text-align: center;
        }

        .axis.corner {
            background: transparent;
            border: none
        }

        .axis.axis-y {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 4px 0;
            /* Garante que o label vertical ocupe toda a altura da célula e centralize */
            height: 100%;
            max-height: 100%;
            white-space: nowrap;
            /* Impede quebra de linha indesejada */
        }

        .quad-label {
            font-weight: 700;
            color: #cfe0ff;
            flex-grow: 1;
            /* Ocupa espaço para empurrar botões */
        }

        .list[data-type="quad"] {
            min-width: unset
        }

        .list[data-type="quad"][data-quad="Q1"] {
            background: #0f2f2a;
            border-color: #1e5b4e
        }

        .list[data-type="quad"][data-quad="Q1"] header {
            background: #104239
        }

        .list[data-type="quad"][data-quad="Q2"] {
            background: #0f243a;
            border-color: #1b4e84
        }

        .list[data-type="quad"][data-quad="Q2"] header {
            background: #0e3155
        }

        .list[data-type="quad"][data-quad="Q3"] {
            background: #3a290f;
            border-color: #7c5a19
        }

        .list[data-type="quad"][data-quad="Q3"] header {
            background: #5a4014
        }

        .list[data-type="quad"][data-quad="Q4"] {
            background: #3a0f12;
            border-color: #7c1920
        }

        .list[data-type="quad"][data-quad="Q4"] header {
            background: #5a1419
        }

        .schedule {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Garante que as listas (slots) na agenda ocupem toda a largura e não fiquem presas em 5cm */
        .schedule .list {
            width: auto !important;
            max-width: none !important;
            min-width: unset !important;
        }

        .schedule header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px 10px;
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--ink);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px
        }

        .schedule .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        #slots {
            overflow-y: auto;
            flex-grow: 1;
        }

        .schedule header input[type=date] {
            background: rgba(0, 0, 0, 0.2);
            color: var(--ink);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 6px 8px;
            width: 120px;
        }

        .schedule header .agenda-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .schedule header .date-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .schedule header button {
            padding: 6px 10px;
            background: var(--brand);
            border: none;
            color: var(--header-text, #fff);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        .schedule header .date-nav button {
            padding: 4px 8px;
            font-size: 16px;
        }

        .schedule header .copy-paste-buttons button {
            font-size: 16px;
            padding: 6px 8px;
        }

        .slot {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08)
        }

        .slot>div.head {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 4px
        }

        .slot .time {
            font-weight: 700;
            font-size: 11px;
            color: #9fc1ff;
            flex-grow: 1;
        }

        .slot .cards {
            display: none;
            padding: 4px;
            min-height: 28px
        }

        .slot.has-items .cards {
            display: block
        }

        .slot.hover {
            background: rgba(var(--brand-rgb), 0.15);
            box-shadow: inset 0 0 0 2px var(--brand);
        }

        .goal-slot {
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .goal-slot>.head .goal-label {
            font-weight: bold;
            color: #ffd54f;
            flex-grow: 1;
        }

        /* Estilo para o slot de "Horário a definir" na agenda */
        .unscheduled-slot {
            background: var(--panel);
            border-bottom: 2px solid var(--brand);
            display: none;
            /* Escondido por padrão */
        }

        .unscheduled-slot.has-items {
            display: flex !important;
            /* Força display flex */
        }

        .unscheduled-slot>.head .unscheduled-label {
            font-weight: bold;
            color: #ff9800;
            /* Laranja para destaque */
            font-size: 12px;
            flex-grow: 1;
        }

        .placeholder {
            height: 38px;
            border: 2px dashed var(--brand);
            border-radius: 8px;
            background: rgba(var(--brand-rgb), 0.1);
            margin: 4px 0
        }

        .ctx {
            position: fixed;
            background: #0b1220;
            color: #fff;
            border: 1px solid #24314a;
            border-radius: 8px;
            min-width: 240px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            display: none;
            z-index: 1000
        }

        .ctx button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #dbe7ff;
            padding: 10px 12px;
            border-radius: 0;
            cursor: pointer
        }

        .ctx button:hover {
            background: #1a2842
        }

        .ctx .shortcut {
            margin-left: auto;
            font-size: 0.8em;
            color: var(--muted);
            padding-left: 10px;
        }

        .ctx .sep {
            height: 1px;
            background: #23314a;
            margin: 6px 0
        }

        .ctx-sub {
            position: absolute;
            left: 100%;
            top: 0;
            background: #0b1220;
            color: #fff;
            border: 1px solid #24314a;
            border-radius: 8px;
            min-width: 240px;
            /* CORREÇÃO DE MENU: Altura máxima e Scroll */
            max-height: 60vh;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
            display: none
        }

        /* CORREÇÃO DE MENU: Vira para a esquerda se faltar espaço */
        .ctx-sub.flip-left {
            left: auto !important;
            right: 100% !important;
            border-right: 1px solid #24314a;
            border-left: none;
            margin-right: 2px;
        }

        .list header .more {
            margin-left: auto;
            background: transparent;
            border: 1px solid transparent;
            color: #9fc1ff;
            border-radius: 6px;
            padding: 0 6px;
            line-height: 20px;
            cursor: pointer
        }

        .modal-wrap {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999
        }

        .modal {
            background: #0b1220;
            color: #fff;
            border: 1px solid #24314a;
            border-radius: 12px;
            min-width: 280px;
            max-width: 94vw;
            padding: 14px 14px 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5)
        }

        .modal h3 {
            margin: 0 0 10px;
            font-size: 16px
        }

        .modal .row {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: flex-end
        }

        .modal .row button {
            background: #1976d2;
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 8px 10px;
            cursor: pointer
        }

        .modal .row button.cancel {
            background: #6b7a93
        }

        .import-options button {
            margin: 5px;
            flex-grow: 1;
        }

        .palette-editor {
            display: none;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .palette-editor.editing {
            display: flex;
        }

        .palette-grid.editing {
            display: none;
        }

        .palette-editor-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .palette-editor-swatch {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #375b86;
            flex-shrink: 0;
        }

        .palette-editor input {
            background: #0b2240;
            border: 1px solid #2a4e78;
            border-radius: 8px;
            color: #fff;
            padding: 6px 8px;
            flex: 1;
        }

        .modal .row .manage-labels-btn {
            margin-right: auto;
            background: #3a3f4b;
        }

        @keyframes spinner_zKoa {
            100% {
                transform: rotate(360deg)
            }
        }

        @keyframes spinner_YpZS {
            0% {
                stroke-dasharray: 0 150;
                stroke-dashoffset: 0
            }

            47.5% {
                stroke-dasharray: 42 150;
                stroke-dashoffset: -16
            }

            95%,
            100% {
                stroke-dasharray: 42 150;
                stroke-dashoffset: -59
            }
        }

        .spinner_V8m1 {
            transform-origin: center;
            animation: spinner_zKoa 2s linear infinite
        }

        .spinner_V8m1 circle {
            stroke-linecap: round;
            animation: spinner_YpZS 1.5s ease-in-out infinite
        }

        @keyframes flash {

            0%,
            100% {
                background-color: var(--card);
            }

            50% {
                background-color: #ffcc00;
                color: #000;
            }
        }

        @media (max-width: 700px) {
            .workspace {
                flex-direction: column;
                overflow-y: auto;
                padding: 8px;
                gap: 8px;
            }

            #main-content {
                overflow: visible;
                height: auto;
            }

            .resizer {
                display: none !important;
            }

            .board-container,
            .matrix-container,
            .weekly-container {
                height: auto !important;
                min-height: unset !important;
                flex: none !important;
                overflow: visible !important;
            }

            #agenda-sidebar {
                display: none
            }

            .board {
                order: 1;
                overflow: visible;
                min-height: unset;
            }

            .matrix {
                order: 2;
                margin-top: 16px;
                min-height: unset;
            }

            .list {
                min-width: unset;
                width: 100%;
                margin-bottom: 12px;
            }

            header.app {
                height: auto;
                padding-bottom: 10px;
            }

            header.app h1 {
                margin-right: 10px;
            }

            #toggleBoardBtn,
            #toggleMatrixBtn,
            #toggleAgendaBtn {
                display: none;
            }

            .board-controls {
                width: 100%;
                margin: 10px 0;
                justify-content: space-between;
                order: 3;
            }

            .board-selector {
                flex-grow: 1;
            }
        }

        /* WEEKLY VIEW STYLES */
        .weekly-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
            min-height: 300px;
            transition: all .3s ease-in-out;
        }

        .weekly-container.collapsed {
            display: none !important;
        }

        /* Container de navegação da semana */
        .weekly-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 5px;
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .weekly-controls button {
            background: var(--brand);
            color: var(--header-text, #fff);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weekly-controls span {
            color: var(--ink);
            font-weight: bold;
            font-size: 14px;
        }

        .weekly-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            padding: 10px;
            overflow-x: auto;
            height: 100%;
        }

        .weekly-grid .cards {
            gap: 8px;
            /* Mais espaço entre cards */
        }

        .day-column {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-width: 200px;
            /* Garante largura mínima legível */
        }

        .day-column.today {
            border-color: var(--brand);
            background: var(--card);
        }

        .day-column header {
            padding: 8px 12px;
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--ink);
            font-weight: bold;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-column header .date-label {
            font-size: 0.85em;
            color: var(--muted);
            display: block;
            margin-top: 2px;
        }

        .day-column .cards {
            padding: 6px;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 50px;
        }

        /* Cartão Espelho (Vem da Agenda) */
        .card.mirror-card {
            /* border: 1px dashed #4285F4; Removendo estilo visual diferente para parecer nativo */
            /* background: #0f2f45; */
            opacity: 0.9;
            /* Agora é clicável e arrastável */
            cursor: grab;
        }

        /* Diferenciar visualmente apenas cartões agendados */
        .card.mirror-card.is-scheduled {
            border: 1px dashed #4285F4;
            background: #0f2f45;
        }

        .card.mirror-card .text::before {
            /* content: "🕒 ";  Remove ícone automático, usar badge */
        }

        /* ===== MODO FOCO (NOTINHA) ===== */
        body.focus-mode header.app,
        body.focus-mode .workspace {
            display: none !important;
        }

        #focus-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 18, 32, 0.96);
            backdrop-filter: blur(10px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body.focus-mode #focus-overlay {
            display: flex;
        }

        .focus-window {
            display: flex;
            gap: 30px;
            align-items: stretch;
            justify-content: center;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
        }

        #focus-overlay .focus-card-clone {
            background: var(--card);
            border: 2px solid var(--focus-border-color, #ffa726);
            border-radius: 12px;
            padding: 30px;
            flex: 1.2;
            min-width: 300px;
            max-width: 460px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 4px var(--focus-glow-color, rgba(255, 167, 38, 0.2));
            color: var(--ink);
            font-size: 22px;
            text-align: center;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            animation: pulse-orange-focus 2s infinite;
        }

        @keyframes pulse-orange-focus {
            0% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 0 var(--focus-glow-color, rgba(255, 167, 38, 0.4)); }
            50% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 8px var(--focus-glow-color-half, rgba(255, 167, 38, 0.2)); }
            100% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 0 rgba(255, 167, 38, 0); }
        }

        #focus-overlay .focus-time {
            font-size: 56px;
            font-weight: bold;
            color: #66bb6a;
            margin: 24px 0;
            font-family: monospace;
        }

        .focus-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .focus-controls button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 15px;
            font-weight: bold;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s, transform 0.1s;
        }

        .focus-controls button:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .focus-controls button:active {
            transform: scale(0.95);
        }

        #focusToggleBtn {
            font-size: 22px;
            background: rgba(42, 113, 255, 0.15);
            border-color: rgba(42, 113, 255, 0.3);
            color: #64b5f6;
            width: 54px;
            height: 54px;
        }
        
        #focusToggleBtn:hover {
            background: rgba(42, 113, 255, 0.25);
            border-color: rgba(42, 113, 255, 0.5);
        }

        .focus-controls button.focus-complete-btn {
            width: auto;
            padding: 0 18px;
            border-radius: 23px;
            background: rgba(102, 187, 106, 0.15);
            border-color: rgba(102, 187, 106, 0.3);
            color: #81c784;
            font-size: 14px;
            font-weight: 600;
        }
        
        .focus-controls button.focus-complete-btn:hover {
            background: rgba(102, 187, 106, 0.25);
            border-color: rgba(102, 187, 106, 0.5);
        }

        #focusCloseBtn {
            font-size: 16px;
            background: rgba(239, 83, 80, 0.15);
            border-color: rgba(239, 83, 80, 0.3);
            color: #e57373;
        }
        
        #focusCloseBtn:hover {
            background: rgba(239, 83, 80, 0.25);
            border-color: rgba(239, 83, 80, 0.5);
        }

        /* OUTROS CRONÔMETROS SIDEBAR */
        .focus-timers-panel {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .focus-panel-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .focus-panel-header h3 {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .focus-filter-tabs {
            display: flex;
            background: rgba(0,0,0,0.25);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .focus-filter-tabs button {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .focus-filter-tabs button.active {
            background: var(--brand);
            color: #fff;
        }

        .focus-sort-container {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin-top: 6px;
            background: rgba(0,0,0,0.15);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .focus-sort-container span {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #focusSortSelect {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--ink);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
            flex-grow: 1;
            transition: border-color 0.2s, background 0.2s;
        }

        #focusSortSelect:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.35);
        }

        #focusSortSelect option {
            background: #0f223d;
            color: var(--ink);
        }

        .focus-timers-list {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .focus-timer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            gap: 10px;
        }

        .focus-timer-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .focus-timer-item.active {
            border-color: #ffa726;
            background: rgba(255, 167, 38, 0.06);
        }

        .focus-timer-item.dragging {
            opacity: 0.4;
            border: 1px dashed var(--brand) !important;
            background: rgba(25, 118, 210, 0.05) !important;
        }

        .focus-timer-item.drag-over-top {
            border-top: 2px solid var(--brand) !important;
        }

        .focus-timer-item.drag-over-bottom {
            border-bottom: 2px solid var(--brand) !important;
        }

        .focus-timer-item .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .focus-timer-item .title {
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .focus-timer-item .time-state {
            font-size: 11px;
            color: var(--muted);
        }

        .focus-timer-item .controls {
            display: flex;
            align-items: center;
        }

        .focus-timer-item .play-pause-btn {
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            color: var(--brand);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .focus-timer-item .play-pause-btn:hover {
            transform: scale(1.15);
        }

        /* SELECTION MARQUEE */
        #marquee {
            position: fixed;
            border: 1px dashed #2a71ff;
            background: rgba(42, 113, 255, 0.15);
            pointer-events: none;
            display: none;
            z-index: 10000;
        }

        /* RESIZERS */
        .resizer {
            background-color: #19375b;
            position: relative;
            z-index: 10;
            transition: background-color 0.2s;
        }
        
        .resizer:hover, .resizer.resizing {
            background-color: #2a71ff;
        }

        .resizer-v {
            width: 8px;
            cursor: col-resize;
            margin: 0 -4px;
            flex-shrink: 0;
            border-radius: 4px;
        }

        .resizer-h {
            height: 8px;
            cursor: row-resize;
            margin: -4px 0;
            flex-shrink: 0;
            border-radius: 4px;
        }

        /* Esconder resizer quando os paineis estão colapsados */
        .workspace.agenda-collapsed .resizer-v { display: none; }
        .board-container.collapsed + .resizer-h { display: none; }
        .matrix-container.collapsed ~ .resizer-h { display: none; }
        .weekly-container.collapsed + .resizer-h { display: none; }

        /* AI ASSISTANT IN HEADER */
        .ai-assistant-container {
            position: relative;
            z-index: 995;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-width: 280px;
            max-width: 450px;
            margin: 2px 0;
        }

        .ai-prompt-bar {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(25, 118, 210, 0.3);
            border-radius: 20px;
            padding: 2px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .ai-prompt-bar:focus-within {
            border-color: rgba(25, 118, 210, 0.8);
            box-shadow: 0 0 10px rgba(25, 118, 210, 0.25);
        }

        .ai-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 4px 0;
            font-size: 14px;
            outline: none;
            min-width: 0;
        }

        .ai-input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .ai-btn {
            background: transparent;
            border: none;
            color: #9fb3d2;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            outline: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 13px;
        }

        .ai-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .ai-btn.active {
            color: #ffd54f;
        }

        .ai-mic-btn.recording {
            background: rgba(239, 83, 80, 0.3);
            color: #ef5350;
            animation: pulseMic 1.5s infinite;
        }

        .ai-send-btn {
            background: #0e58a5;
            color: #fff;
        }

        .ai-send-btn:hover {
            background: #1976d2;
        }

        .ai-response-bubble {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 6px;
            background: #0b1220;
            border: 1px solid #24314a;
            border-radius: 8px;
            padding: 10px 12px;
            color: #e9f1ff;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
            display: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            animation: fadeInAI 0.2s ease-out;
        }

        .ai-response-bubble.active {
            display: block;
        }

        .ai-response-bubble .ai-explanation {
            font-weight: 500;
            color: #64b5f6;
            margin-bottom: 4px;
        }

        .ai-response-bubble .ai-question {
            font-weight: 600;
            color: #ffd54f;
            margin-top: 4px;
        }

        .ai-response-bubble .ai-error {
            color: #ff8a80;
            font-weight: 500;
        }

        /* Soundwave animation for mic recording */
        .ai-soundwave {
            display: none;
            align-items: center;
            gap: 2px;
            height: 14px;
            padding: 0 4px;
        }

        .ai-soundwave.active {
            display: flex;
        }

        .ai-soundwave span {
            display: block;
            width: 2px;
            height: 6px;
            background: #ef5350;
            border-radius: 2px;

// FUNÇÃO DE ÁUDIO (Beep) para o Timer
function playBeep() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.5);
    } catch (e) { console.warn("Áudio bloqueado", e); }
}

// FUNÇÃO IMPORTANTE: Separa o que é do Quadro do que é da Agenda Global
function syncAllCardsOrderFromDOM() {
    const domCards = Array.from(document.querySelectorAll('.card:not(.mirror-card)'));
    if (domCards.length === 0) return;
    const domCardSet = new Set(domCards);
    const nonDomCards = allCards.filter(c => !domCardSet.has(c));
    allCards = [...domCards, ...nonDomCards];
}

// FUNCAO IMPORTANTE: Separa o que e do Quadro do que e da Agenda Global
function serializeAndSeparate() {
    syncAllCardsOrderFromDOM();
    var boardData = [];
    var agendaData = [];

    // 1. Kanban Lists (Sempre do Quadro)
    $('.list[data-type="kanban"]', boardEl).forEach(function (l) {
        const title = l.querySelector('.title').value;
        const cardsInList = $('.card', l).map(c => allCards.find(cacheCard => cacheCard === c)).filter(Boolean).map(cardToData);
        boardData.push({ type: 'kanban', title: title, cards: cardsInList, boardId: l.dataset.boardId || '' });
    });

    // 2. Matrix Lists (Sempre do Quadro)
    if (matrixEl) {
        $('.list[data-type="quad"]', matrixEl).forEach(function (l) {
            const quad = l.dataset.quad;
            const cardsInList = $('.card', l).map(c => allCards.find(cacheCard => cacheCard === c)).filter(Boolean).map(cardToData);
            boardData.push({ type: 'quad', quad: quad, cards: cardsInList });
        });
    }

    // 3. Agenda & Objetivos & Unscheduled (Sempre Global)
    // Vamos procurar em allCards tudo que tem 'when' definido
    // Isso pega tanto o que está nos slots visuais quanto o que pode ter se perdido
    const globalCards = allCards.filter(c => c.dataset.when && c.dataset.when.length > 0);

    // Agrupar para salvar bonito, mas na real salvamos uma lista flat de "scheduled items" seria melhor.
    // Mas para manter compatibilidade com a estrutura antiga:

    // Goal
    const goalCards = globalCards.filter(c => c.dataset.when.endsWith('TGOAL')).map(cardToData);
    if (goalCards.length > 0) agendaData.push({ type: 'goal', goal: true, cards: goalCards });

    // Time Slots
    const timeCardsMap = {};
    globalCards.filter(c => /T\d{2}:\d{2}$/.test(c.dataset.when)).forEach(c => {
        const time = c.dataset.when.substring(11); // Pega HH:MM
        if (!timeCardsMap[time]) timeCardsMap[time] = [];
        timeCardsMap[time].push(cardToData(c));
    });
    for (const t in timeCardsMap) {
        agendaData.push({ type: 'time', time: t, cards: timeCardsMap[t] });
    }
    // Unscheduled (A definir)
    const unscheduledCards = globalCards.filter(c => c.dataset.when.endsWith('T')).map(cardToData);
    if (unscheduledCards.length > 0) {
        agendaData.push({ type: 'unscheduled', cards: unscheduledCards });
    }

    return { boardData, agendaData };
}

// Função unificada para carregar tudo
function loadAndRenderAll() {
    let boardData = [];
    let agendaData = [];

    if (currentBoardId === 'board-todos') {
        // Aggregate all boards except trash and board-todos itself
        let mergedKanbanLists = [];
        let mergedQuadLists = { Q1: [], Q2: [], Q3: [], Q4: [] };

        boardsMeta.forEach(b => {
            if (b.id === 'board-trash' || b.id === 'board-todos') return;
            let bData = [];
            try {
                const bStr = localStorage.getItem(LS_BOARD_PREFIX + b.id);
                if (bStr) bData = JSON.parse(bStr);
            } catch (e) { console.error("Error load board", b.id, e); }

            bData.forEach(list => {
                if (list.type === 'kanban') {
                    let targetList = mergedKanbanLists.find(l => l.title.toLowerCase().trim() === list.title.toLowerCase().trim());
                    if (!targetList) {
                        targetList = { type: 'kanban', title: list.title, cards: [], boardId: b.id };
                        mergedKanbanLists.push(targetList);
                    }
                    const cardsWithBoardId = (list.cards || []).map(c => {
                        return { ...c, boardId: c.boardId || b.id };
                    });
                    targetList.cards = targetList.cards.concat(cardsWithBoardId);
                } else if (list.type === 'quad' && mergedQuadLists[list.quad]) {
                    const cardsWithBoardId = (list.cards || []).map(c => {
                        return { ...c, boardId: c.boardId || b.id };
                    });
                    mergedQuadLists[list.quad] = mergedQuadLists[list.quad].concat(cardsWithBoardId);
                }
            });
        });

        // Add TODOS's own cards if they exist
        let todosOwnData = [];
        try {
            const todosOwnStr = localStorage.getItem(LS_BOARD_PREFIX + 'board-todos');
            if (todosOwnStr) todosOwnData = JSON.parse(todosOwnStr);
        } catch(e) {}
        todosOwnData.forEach(list => {
            if (list.type === 'kanban') {
                let targetList = mergedKanbanLists.find(l => l.title.toLowerCase().trim() === list.title.toLowerCase().trim());
                if (!targetList) {
                    targetList = { type: 'kanban', title: list.title, cards: [], boardId: 'board-todos' };
                    mergedKanbanLists.push(targetList);
                }
                const cardsWithBoardId = (list.cards || []).map(c => {
                    return { ...c, boardId: c.boardId || 'board-todos' };
                });
                targetList.cards = targetList.cards.concat(cardsWithBoardId);
            } else if (list.type === 'quad' && mergedQuadLists[list.quad]) {
                const cardsWithBoardId = (list.cards || []).map(c => {
                    return { ...c, boardId: c.boardId || 'board-todos' };
                });
                mergedQuadLists[list.quad] = mergedQuadLists[list.quad].concat(cardsWithBoardId);
            }
        });

        boardData = mergedKanbanLists;
        Object.keys(mergedQuadLists).forEach(q => {
            boardData.push({ type: 'quad', quad: q, cards: mergedQuadLists[q] });
        });
    } else {
        try {
            const bStr = localStorage.getItem(LS_BOARD_PREFIX + currentBoardId);
            if (bStr) boardData = JSON.parse(bStr);
        } catch (e) { console.error("Erro load board", e); }
    }

    try {
        const aStr = localStorage.getItem(LS_GLOBAL_AGENDA);
        if (aStr) agendaData = JSON.parse(aStr);
    } catch (e) { console.error("Erro load agenda", e); }

    // Se for a primeira vez e não tiver agenda global, tenta migrar dados da agenda que estavam no board
    // (Isso previne perda de dados ao atualizar o código)
    if (agendaData.length === 0 && boardData.some(d => d.type === 'time' || d.type === 'goal' || d.type === 'unscheduled')) {
        console.log("Migrando agenda do quadro para global...");
        agendaData = boardData.filter(d => d.type === 'time' || d.type === 'goal' || d.type === 'unscheduled');
        boardData = boardData.filter(d => d.type === 'kanban' || d.type === 'quad');
        // Salva a migração
        localStorage.setItem(LS_BOARD_PREFIX + currentBoardId, JSON.stringify(boardData));
        localStorage.setItem(LS_GLOBAL_AGENDA, JSON.stringify(agendaData));
    }

    // Sincronizar boardId nos cartões se não tiver
    if (currentBoardId !== 'board-todos') {
        boardData.forEach(list => {
            if (list.cards) {
                list.cards.forEach(c => {
                    if (!c.boardId) c.boardId = currentBoardId;
                });
            }
        });
    }
    agendaData.forEach(list => {
        if (list.cards) {
            list.cards.forEach(c => {
                if (!c.boardId) c.boardId = currentBoardId || 'board-todos';
            });
        }
    });

    renderFromData(boardData, agendaData);
}

function renderFromData(boardData, agendaData) {
    saveSelectionState();
    // Junta os dois para renderizar, mas a lógica interna sabe que vieram de lugares diferentes
    // Na verdade, a função original renderFromData aceitava um array único.
    // Vamos concatenar para reusar a lógica de renderização, pois visualmente é tudo card.
    const allData = (boardData || []).concat(agendaData || []);

    // === PRESERVAR SCROLL ===
    const scrollMap = new Map();
    scrollMap.set(boardEl, { left: boardEl.scrollLeft, top: boardEl.scrollTop });
    const mainContent = document.getElementById('main-content');
    if (mainContent) scrollMap.set(mainContent, { left: mainContent.scrollLeft, top: mainContent.scrollTop });
    const slots = document.getElementById('slots');
    if (slots) scrollMap.set(slots, { left: slots.scrollLeft, top: slots.scrollTop });
    if (matrixEl) scrollMap.set(matrixEl, { left: matrixEl.scrollLeft, top: matrixEl.scrollTop });

    allCards = [];
    boardEl.innerHTML = '';
    matrixEl.innerHTML = '';
    slotsRoot.innerHTML = '';

    ensureMatrix();
    ensureSchedule(false);

    var quadMap = {
        Q1: matrixEl.querySelector('.list[data-quad="Q1"] .cards'),
        Q2: matrixEl.querySelector('.list[data-quad="Q2"] .cards'),
        Q3: matrixEl.querySelector('.list[data-quad="Q3"] .cards'),
        Q4: matrixEl.querySelector('.list[data-quad="Q4"] .cards')
    };

    function appendCardsToDOM(container, cardsData) {
        if (!container || !cardsData || !cardsData.length) return;
        var fragment = document.createDocumentFragment();
        cardsData.forEach(function (cd) {
            const cardEl = createCard(cd);
            fragment.appendChild(cardEl);
        });
        container.appendChild(fragment);
    }

    allData.forEach(function (entry) {
        if (entry.type === 'kanban') {
            var l = createList(entry.title || 'Lista');
            l.dataset.boardId = entry.boardId || currentBoardId;
            appendCardsToDOM(l.querySelector('.cards'), entry.cards);
        } else if (entry.type === 'quad' && quadMap[entry.quad]) {
            appendCardsToDOM(quadMap[entry.quad], entry.cards);
        } else if (entry.type === 'time' || entry.type === 'goal') {
            (entry.cards || []).forEach(cardData => {
                if (entry.goal && cardData.when && !cardData.when.endsWith('TGOAL')) {
                    cardData.when = (cardData.when.split('T')[0] || getActiveDay()) + 'TGOAL';
                } else if (entry.time && cardData.when && !cardData.when.includes('T' + entry.time)) {
                    cardData.when = (cardData.when.split('T')[0] || getActiveDay()) + 'T' + entry.time;
                }
                createCard(cardData);
            });
        } else if (entry.type === 'unscheduled') {
            (entry.cards || []).forEach(cardData => {
                createCard(cardData);
            });
        }
    });

    applyFilters();
    updateSlotsHasItems();
    updateTotalTimerDisplay();

    if (globalTimerInterval) {
        clearInterval(globalTimerInterval);
        globalTimerInterval = null;
    }
    startGlobalTimer();
    updateListHeaderTooltips();

    scrollMap.forEach((pos, element) => {
        if (element) {
            element.scrollLeft = pos.left;
            element.scrollTop = pos.top;
        }
    });
    restoreSelectionState();
}

function restore(histObj) {
    // histObj tem { boardData, agendaData }
    if (histObj && histObj.boardData) {
        renderFromData(histObj.boardData, histObj.agendaData);
        persist(); // Salva o estado restaurado
    } else {
        // Fallback para formato antigo de historico se existir
        renderFromData(histObj, []);
    }
}

function generateId() {

function sortBoardsMeta() {
    if (!boardsMeta || !Array.isArray(boardsMeta)) return;
    const todosBoard = boardsMeta.find(b => b.id === 'board-todos');
    const trashBoard = boardsMeta.find(b => b.id === 'board-trash');
    const otherBoards = boardsMeta.filter(b => b.id !== 'board-todos' && b.id !== 'board-trash');
    
    otherBoards.sort((a, b) => {
        const nameA = a.name || '';
        const nameB = b.name || '';
        return nameA.localeCompare(nameB, undefined, { sensitivity: 'base', numeric: true });
    });
    
    const sorted = [];
    if (todosBoard) sorted.push(todosBoard);
    sorted.push(...otherBoards);
    if (trashBoard) sorted.push(trashBoard);
    boardsMeta = sorted;
}

function loadBoardsMetadata() {
    try {
        const raw = localStorage.getItem(LS_BOARDS_META);
        boardsMeta = raw ? JSON.parse(raw) : [];
        sortBoardsMeta();
    } catch (e) { boardsMeta = []; }
}

function saveBoardsMetadata(syncToCloud = true) {
    sortBoardsMeta();
    localStorage.setItem(LS_BOARDS_META, JSON.stringify(boardsMeta));
    updateBoardSelectUI();

    // Sync metadata to Firebase
    if (syncToCloud && isFirebaseReady && auth && auth.currentUser) {
        db.ref('users/' + auth.currentUser.uid + '/meta').set(boardsMeta)
            .catch(e => console.error("Erro ao salvar metadata na nuvem", e));
    }
}

function ensureTodosBoard() {
    if (!boardsMeta.find(b => b.id === 'board-todos')) {
        boardsMeta.unshift({ id: 'board-todos', name: 'TODOS 📋', lastModified: Date.now(), color: '#1976d2' });
        saveBoardsMetadata(true);
    }
}

function ensureTrashBoard() {
    if (!boardsMeta.find(b => b.id === 'board-trash')) {
        boardsMeta.push({ id: 'board-trash', name: 'Lixeira 🗑️', lastModified: Date.now(), color: '#5a1419' });
        localStorage.setItem(LS_BOARD_PREFIX + 'board-trash', JSON.stringify([{ type: 'kanban', title: 'Apagados', cards: [] }]));
        saveBoardsMetadata(true);
    }
}

function migrateToMultiBoard() {
    const legacyData = localStorage.getItem(LS_KEY);
    const hasMetadata = localStorage.getItem(LS_BOARDS_META);

    if (legacyData && !hasMetadata) {
        console.log("Migrando para multi-board...");
        const newId = generateId();
        const mainBoard = { id: newId, name: 'Quadro Principal', lastModified: Date.now(), color: DEFAULT_THEME_COLOR };
        boardsMeta = [mainBoard];
        ensureTodosBoard();
        ensureTrashBoard();

        // Tenta separar o que é agenda do que é quadro na migração inicial
        // (Simplificado: joga tudo no quadro primeiro, o loadAndRenderAll separa depois)
        localStorage.setItem(LS_BOARD_PREFIX + newId, legacyData);

        currentBoardId = newId;
        localStorage.setItem(LS_CURRENT_BOARD, currentBoardId);
        saveBoardsMetadata();
    } else if (!hasMetadata) {
        createNewBoard('Meu Quadro');
        ensureTodosBoard();
        ensureTrashBoard();
    } else {
        loadBoardsMetadata();
        ensureTodosBoard();
        ensureTrashBoard();
        currentBoardId = localStorage.getItem(LS_CURRENT_BOARD);
        if (!boardsMeta.find(b => b.id === currentBoardId)) {
            if (boardsMeta.length > 0) currentBoardId = boardsMeta[0].id;
            else createNewBoard('Meu Quadro');
        }
    }
}

function createNewBoard(name) {
    const id = generateId();
    const newBoard = { id: id, name: name || 'Novo Quadro', lastModified: Date.now(), color: DEFAULT_THEME_COLOR };
    boardsMeta.push(newBoard);
    saveBoardsMetadata();
    localStorage.setItem(LS_BOARD_PREFIX + id, JSON.stringify([]));
    switchBoard(id);
}

function renameBoard() {
    if (currentBoardId === 'board-todos' || currentBoardId === 'board-trash') {
        alert("Você não pode alterar ou renomear este quadro especial.");
        return;
    }
    const board = boardsMeta.find(b => b.id === currentBoardId);
    if (!board) return;
    const newName = prompt("Novo nome para o quadro:", board.name);
    if (newName && newName.trim()) {
        board.name = newName.trim();
        saveBoardsMetadata();
    }
}

function deleteBoard() {
    if (currentBoardId === 'board-todos' || currentBoardId === 'board-trash') {
        alert("Você não pode excluir este quadro especial.");
        return;
    }
    if (boardsMeta.length <= 2) { // 2 because TODOS and Lixeira are permanent
        alert("Você não tem outros quadros para excluir.");
        return;
    }
    const board = boardsMeta.find(b => b.id === currentBoardId);
    if (!board) return;

    if (confirm(`Tem certeza que deseja excluir o quadro "${board.name}"? Isso não pode ser desfeito.`)) {
        localStorage.removeItem(LS_BOARD_PREFIX + currentBoardId);
        if (isFirebaseReady && auth && auth.currentUser) {
            db.ref('users/' + auth.currentUser.uid + '/boards/' + currentBoardId).remove();
        }
        boardsMeta = boardsMeta.filter(b => b.id !== currentBoardId);
        // Switch to first non-todos board if possible
        const nextBoard = boardsMeta.find(b => b.id !== 'board-trash') || boardsMeta[0];
        currentBoardId = nextBoard.id;
        saveBoardsMetadata();
        localStorage.setItem(LS_CURRENT_BOARD, currentBoardId);
        window.location.reload();
    }
}

function cloneBoard() {
    const board = boardsMeta.find(b => b.id === currentBoardId);
    if (!board) return;
    const newName = prompt("Nome para a cópia:", board.name + " (Cópia)");
    if (!newName) return;

    // Na cópia, pegamos APENAS os dados do quadro, não a agenda (que é global)
    const { boardData } = serializeAndSeparate();
    const newId = generateId();

    const newBoard = { id: newId, name: newName, lastModified: Date.now(), color: board.color || DEFAULT_THEME_COLOR };
    boardsMeta.push(newBoard);
    saveBoardsMetadata();

    localStorage.setItem(LS_BOARD_PREFIX + newId, JSON.stringify(boardData));
    switchBoard(newId);
}

function switchBoard(id) {
    if (id === currentBoardId && boardEl.children.length > 0) return;

    saveImmediately();

    console.log("Switching to board: " + id);
    currentBoardId = id;
    localStorage.setItem(LS_CURRENT_BOARD, id);

    const board = boardsMeta.find(b => b.id === id);
    if (board) setBoardTheme(board.color);

    loadAndRenderAll();

    // Reinicia historico de undo
    hist = []; cursor = -1;
    const { boardData, agendaData } = serializeAndSeparate();
    pushHistory({ boardData, agendaData });

    updateBoardSelectUI();

    if (isFirebaseReady && auth && auth.currentUser) {
        subscribeToCurrentBoard(auth.currentUser.uid, id);
    }
}

function getContrastYIQ(hexcolor){
    if (!hexcolor || hexcolor.length < 3) return 'dark';
    var hex = hexcolor.replace('#', '');
    if (hex.length === 3) {
        hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    }
    var r = parseInt(hex.substr(0,2),16);
    var g = parseInt(hex.substr(2,2),16);
    var b = parseInt(hex.substr(4,2),16);
    var yiq = ((r*299)+(g*587)+(b*114))/1000;
    return (yiq >= 170) ? 'light' : 'dark';
}

function setBoardTheme(color) {
    const r = document.querySelector(':root');
    const safeColor = color || DEFAULT_THEME_COLOR;
    const theme = THEMES[safeColor] || THEMES[DEFAULT_THEME_COLOR];
    const brandColor = theme ? theme.brand : safeColor;

    if (theme) {
        r.style.setProperty('--brand', theme.brand);
        r.style.setProperty('--bg', theme.bg);
        r.style.setProperty('--panel', theme.panel);
        r.style.setProperty('--card', theme.card);
        r.style.setProperty('--ink', theme.text);
    } else {
        r.style.setProperty('--brand', safeColor);
        r.style.setProperty('--bg', '#0f1a2a');
        r.style.setProperty('--panel', '#0f223d');
        r.style.setProperty('--card', '#112b4a');
        r.style.setProperty('--ink', '#e9f1ff');
    }

    // Definir --brand-rgb para opacidades em CSS
    try {
        var hex = brandColor.replace('#', '');
        if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
        var rVal = parseInt(hex.substr(0,2), 16);
        var gVal = parseInt(hex.substr(2,2), 16);
        var bVal = parseInt(hex.substr(4,2), 16);
        r.style.setProperty('--brand-rgb', `${rVal}, ${gVal}, ${bVal}`);
    } catch (e) {
        r.style.setProperty('--brand-rgb', '25, 118, 210');
    }

    // Cálculo do contraste YIQ para o cabeçalho e painéis temáticos
    const contrast = getContrastYIQ(brandColor);
    if (contrast === 'light') {
        r.style.setProperty('--header-text', '#122b4a');
        r.style.setProperty('--header-btn-bg', 'rgba(0, 0, 0, 0.08)');
        r.style.setProperty('--header-btn-border', 'rgba(0, 0, 0, 0.15)');
        r.style.setProperty('--header-btn-hover', 'rgba(0, 0, 0, 0.15)');
        r.style.setProperty('--header-btn-hover-border', 'rgba(0, 0, 0, 0.25)');
    } else {
        r.style.setProperty('--header-text', '#ffffff');
        r.style.setProperty('--header-btn-bg', 'rgba(255, 255, 255, 0.12)');
        r.style.setProperty('--header-btn-border', 'rgba(255, 255, 255, 0.2)');
        r.style.setProperty('--header-btn-hover', 'rgba(255, 255, 255, 0.22)');
        r.style.setProperty('--header-btn-hover-border', 'rgba(255, 255, 255, 0.35)');
    }
}

function moveCardToBoard(cardElement, targetBoardId, targetListTitle) {
    if (!cardElement) return;

    const targetBoardMeta = boardsMeta.find(b => b.id === targetBoardId);
    const boardName = targetBoardMeta ? targetBoardMeta.name : 'Outro Quadro';
    addCardHistory(cardElement, 'Movido para o quadro "' + boardName + '"');

    const cardData = cardToData(cardElement);
    cardData.when = '';
    cardData.boardId = targetBoardId;
    cardData.color = getBoardColor(targetBoardId) || '';

    const targetData = getBoardData(targetBoardId);
    let moved = false;
    let actualListTitle = targetListTitle;

    let targetList = targetData.find(l => l.type === 'kanban' && l.title === targetListTitle);

    if (!targetList && targetBoardId === 'board-trash') {
        targetList = { type: 'kanban', title: 'Apagados', cards: [] };
        targetData.push(targetList);
    }

    if (targetList) {
        if (!targetList.cards) targetList.cards = [];
        targetList.cards.push(cardData);
        moved = true;
    } else {
        if (targetData.length > 0 && targetData[0].type === 'kanban') {
            targetData[0].cards.push(cardData);
            moved = true;
            actualListTitle = targetData[0].title;
            if (targetBoardId !== 'board-trash') {
                alert(`Lista "${targetListTitle}" nÃ£o encontrada. Movido para "${targetData[0].title}".`);
            }
        } else {
            targetData.unshift({ type: 'kanban', title: 'Inbox', cards: [cardData] });
            moved = true;
            actualListTitle = 'Inbox';
        }
    }

    if (moved) {
        let shouldKeepInDOM = (currentBoardId === 'board-todos' && targetBoardId !== 'board-trash');
        
        if (shouldKeepInDOM) {
            const lists = $('.list[data-type="kanban"]');
            const targetListEl = lists.find(l => {
                const titleInp = l.querySelector('.title');
                return titleInp && titleInp.value.toLowerCase().trim() === actualListTitle.toLowerCase().trim();
            });
            if (targetListEl) {
                const cardsContainer = targetListEl.querySelector('.cards');
                if (cardsContainer) {
                    cardElement.dataset.boardId = targetBoardId;
                    cardElement.dataset.color = getBoardColor(targetBoardId) || '';
                    cardElement.dataset.when = '';
                    paintCard(cardElement);
                    cardsContainer.appendChild(cardElement);
                    
                    saveImmediately();
                    
                    localStorage.setItem(LS_BOARD_PREFIX + targetBoardId, JSON.stringify(targetData));
                    const targetBoard = boardsMeta.find(b => b.id === targetBoardId);
                    if (targetBoard) { targetBoard.lastModified = Date.now(); saveBoardsMetadata(); }
                    if (isFirebaseReady && auth && auth.currentUser) {
                        db.ref('users/' + auth.currentUser.uid + '/boards/' + targetBoardId).set(targetData);
                    }
                    
                    const btn = document.createElement('div');
                    btn.textContent = `Card movido para quadro "${targetBoard ? targetBoard.name : 'Outro'}"`;
                    btn.style.position = 'fixed'; btn.style.bottom = '20px'; btn.style.left = '50%'; btn.style.transform = 'translateX(-50%)';
                    btn.style.background = '#28a745'; btn.style.color = 'white'; btn.style.padding = '10px 20px'; btn.style.borderRadius = '5px'; btn.style.zIndex = '9999';
                    document.body.appendChild(btn);
                    setTimeout(() => btn.remove(), 3000);
                    return;
                }
            }
        }

        removeCard(cardElement, true);
        saveImmediately();

        localStorage.setItem(LS_BOARD_PREFIX + targetBoardId, JSON.stringify(targetData));
        const targetBoard = boardsMeta.find(b => b.id === targetBoardId);
        if (targetBoard) { targetBoard.lastModified = Date.now(); saveBoardsMetadata(); }
        if (isFirebaseReady && auth && auth.currentUser) {
            db.ref('users/' + auth.currentUser.uid + '/boards/' + targetBoardId).set(targetData);
        }

        const btn = document.createElement('div');
        btn.textContent = `Card movido para quadro "${targetBoard ? targetBoard.name : 'Outro'}"`;
        btn.style.position = 'fixed'; btn.style.bottom = '20px'; btn.style.left = '50%'; btn.style.transform = 'translateX(-50%)';
        btn.style.background = '#28a745'; btn.style.color = 'white'; btn.style.padding = '10px 20px'; btn.style.borderRadius = '5px'; btn.style.zIndex = '9999';
        document.body.appendChild(btn);
        setTimeout(() => btn.remove(), 3000);
    }
}
