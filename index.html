function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        console.log("Speech recognition not supported in this browser.");
        const micBtn = document.getElementById('aiMicBtn');
        if (micBtn) micBtn.style.display = 'none';
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function() {
        isRecording = true;
        const micBtn = document.getElementById('aiMicBtn');
        if (micBtn) {
            micBtn.classList.add('recording');
            micBtn.textContent = '🛑';
        }
        const sw = document.getElementById('aiSoundwave');
        if (sw) sw.classList.add('active');
        showAiResponseBubble("Ouvindo... Fale agora.", false, false);
    };

    recognition.onend = function() {
        isRecording = false;
        const micBtn = document.getElementById('aiMicBtn');
        if (micBtn) {
            micBtn.classList.remove('recording');
            micBtn.textContent = '🎙️';
        }
        const sw = document.getElementById('aiSoundwave');
        if (sw) sw.classList.remove('active');
    };

    recognition.onerror = function(event) {
        console.error("Speech recognition error", event.error);
        showAiResponseBubble("Erro na gravação de voz: " + event.error, false, true);
    };

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const inputEl = document.getElementById('aiInput');
        if (inputEl) {
            inputEl.value = transcript;
            submitAiCommand();
        }
    };
}

function toggleVoiceRecord() {
    if (!recognition) {
        alert("O reconhecimento de voz não é suportado pelo seu navegador.");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        recognition.start();
    }
}

function showAiResponseBubble(message, isQuestion = false, isError = false) {
    const bubble = document.getElementById('aiResponseBubble');
    if (!bubble) return;
    
    bubble.innerHTML = '';
    if (isError) {
        const errDiv = el('div', 'ai-error');
        errDiv.textContent = message;
        bubble.appendChild(errDiv);
    } else if (isQuestion) {
        const qDiv = el('div', 'ai-question');
        qDiv.textContent = message;
        bubble.appendChild(qDiv);
    } else {
        const expDiv = el('div', 'ai-explanation');
        expDiv.textContent = message;
        bubble.appendChild(expDiv);
    }
    
    bubble.classList.add('active');
    
    if (!isQuestion && !isError && message !== 'Processando...') {
        setTimeout(() => {
            if (bubble.textContent === message) {
                bubble.classList.remove('active');
            }
        }, 8000);
    }
}

async function submitAiCommand() {
    const inputEl = document.getElementById('aiInput');
    if (!inputEl) return;
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    showAiResponseBubble('Processando...', false, false);

    aiConversationHistory.push({ role: 'user', parts: [{ text: text }] });

    const activeBoardMeta = boardsMeta.find(b => b.id === currentBoardId);
    const activeBoardName = activeBoardMeta ? activeBoardMeta.name : 'Principal';
    const existingBoards = boardsMeta.map(b => b.name);
    const activeBoardLists = $('.list[data-type="kanban"]', boardEl).map(l => l.querySelector('.title').value);

    const sysPrompt = `Você é a inteligência artificial de controle do TEA Planner, um aplicativo de produtividade que mistura Kanban, Matriz de Eisenhower (Q1, Q2, Q3, Q4) e Agenda com compromissos diários.

Seu objetivo é analisar o comando em linguagem natural do usuário (em português) e retornar um JSON contendo uma lista de ações estruturadas para o aplicativo executar.

A data de hoje no sistema é: ${getActiveDay()}.
O quadro ativo atualmente é: "${activeBoardName}".
Os quadros existentes no sistema são: ${JSON.stringify(existingBoards)}.
As listas no quadro ativo atualmente são: ${JSON.stringify(activeBoardLists)}.

Você deve analisar o comando e responder estritamente com um JSON no seguinte formato, sem formatação markdown (como blocos de código \`\`\`json), sem textos adicionais antes ou depois.

Formato de Resposta Esperado:
{
  "explanation": "Uma frase amigável explicando o que você entendeu e vai fazer.",
  "question": "Se o comando for ambíguo ou necessitar de esclarecimento (por exemplo, criar uma lista mas existem múltiplos quadros e o usuário não especificou qual, ou criar uma lista de compras mas não disse o nome da lista), faça a pergunta aqui. Se 'question' estiver preenchido, o array 'actions' DEVE estar vazio.",
  "actions": [
    // Array de ações a serem executadas em ordem. Pode ser vazio.
    {
      "type": "SWITCH_BOARD",
      "boardName": "Nome exato do quadro para o qual mudar"
    },
    {
      "type": "CREATE_LIST",
      "boardName": "Nome do quadro", // Opcional (assume o atual se omitido)
      "listTitle": "Nome da Lista"
    },
    {
      "type": "CREATE_CARDS",
      "boardName": "Nome do quadro", // Opcional (assume o atual se omitido)
      "listTitle": "Nome da Lista",  // Opcional se for para Matriz ou Agenda
      "quadrant": "Q1" | "Q2" | "Q3" | "Q4", // Opcional (só preencha se for para a Matriz de Eisenhower)
      "time": "HH:MM", // Opcional (só preencha se for para a Agenda, ex: "10:00")
      "goal": true | false, // Opcional (se for o Objetivo do Dia na agenda)
      "cards": [
        {
          "text": "Texto do cartão",
          "color": "#hex_opcional",
          "due": "YYYY-MM-DD" // Opcional (prazo final, formato YYYY-MM-DD)
        }
      ]
    },
    {
      "type": "COMPLETE_CARDS",
      "timeRange": "morning" | "afternoon" | "evening" | "night" | "all", // Opcional (para completar compromissos do período da manhã/tarde/noite/tudo)
      "time": "HH:MM", // Opcional (completar compromisso de um horário específico)
      "listTitle": "Nome da Lista", // Opcional (completar todos os cartões desta lista no kanban)
      "quadrant": "Q1" | "Q2" | "Q3" | "Q4", // Opcional (completar todos os cartões deste quadrante)
      "all": true | false // Opcional
    },
    {
      "type": "COPY_PASTE_AGENDA",
      "fromDay": "YYYY-MM-DD",
      "toDay": "YYYY-MM-DD"
    }
  ]
}

Regras Importantes:
1. Sempre responda em formato JSON válido e parseável pelo JSON.parse(). Não retorne explicações fora do JSON.
2. Identifique datas relativas baseadas no dia de hoje: "hoje" é ${getActiveDay()}, "amanhã" é o dia seguinte, "ontem" é o dia anterior, etc.
3. Se o usuário quiser criar cartões na agenda, use "time" ou "goal". Exemplo: "Consulta médica 10h" -> type: CREATE_CARDS com time: "10:00".
4. Se o usuário quiser criar uma lista e cartões (ex: "lista de feira com batata e brocolis"), e houver múltiplos quadros no sistema, mas ele não disser em qual quadro: pergunte em qual quadro ele deseja criar preenchendo o campo "question".
5. Se houver apenas 1 quadro cadastrado no sistema além da Lixeira, crie a lista diretamente nele sem perguntar.
6. Se o usuário disser para copiar a agenda de ontem para hoje, retorne uma ação do tipo COPY_PASTE_AGENDA com fromDay = ontem e toDay = hoje.
7. Se o usuário disser "marcar como feito as atividades da manhã", retorne complete_cards com timeRange = "morning". A manhã corresponde a qualquer horário de 06:00 a 11:30.
8. Mantenha os nomes de quadros e listas consistentes com os já existentes, se houver similaridade semântica (ex: "pessoal" e "Pessoal").
`;

    const contents = [
        { role: 'user', parts: [{ text: sysPrompt + "\n\nAgora processe o seguinte diálogo com o usuário:\n" }] }
    ];
    
    aiConversationHistory.forEach(turn => {
        contents.push(turn);
    });

    try {
        const responseText = await callGemini(contents);
        
        let responseJson;
        try {
            let cleanedText = responseText.trim();
            if (cleanedText.startsWith('```')) {
                cleanedText = cleanedText.replace(/^```json\s*/, '').replace(/```$/, '').trim();
            }
            responseJson = JSON.parse(cleanedText);
        } catch (parseErr) {
            console.error("Gemini did not return valid JSON. Raw response: ", responseText);
            showAiResponseBubble("Desculpe, não consegui entender o comando estruturado. Por favor tente reescrever.", false, true);
            aiConversationHistory.pop();
            return;
        }

        aiConversationHistory.push({ role: 'model', parts: [{ text: JSON.stringify(responseJson) }] });

        if (responseJson.question) {
            showAiResponseBubble(responseJson.question, true, false);
        } else {
            if (responseJson.actions && responseJson.actions.length > 0) {
                executeAiActions(responseJson.actions);
            }
            showAiResponseBubble(responseJson.explanation || 'Comando executado com sucesso!', false, false);
            aiConversationHistory = [];
        }
    } catch (apiErr) {
        console.error("Gemini API call failed: ", apiErr);
        const errorMsg = apiErr.message || "Erro desconhecido. Verifique sua chave API e conexão.";
        showAiResponseBubble(`Erro da API: ${errorMsg}`, false, true);
        aiConversationHistory.pop();
    }
}

function executeAiActions(actions) {
    actions.forEach(action => {
        try {
            switch (action.type) {
                case 'SWITCH_BOARD':
                    if (action.boardName) {
                        const board = boardsMeta.find(b => b.name.toLowerCase().trim() === action.boardName.toLowerCase().trim());
                        if (board) {
                            switchBoard(board.id);
                        }
                    }
                    break;

                case 'CREATE_LIST':
                    {
                        let boardId = currentBoardId;
                        if (action.boardName) {
                            const board = boardsMeta.find(b => b.name.toLowerCase().trim() === action.boardName.toLowerCase().trim());
                            if (board) {
                                boardId = board.id;
                                if (boardId !== currentBoardId) {
                                    switchBoard(boardId);
                                }
                            }
                        }
                        let listEl = $('.list[data-type="kanban"]', boardEl).find(l => l.querySelector('.title').value.toLowerCase().trim() === action.listTitle.toLowerCase().trim());
                        if (!listEl) {
                            createList(action.listTitle);
                            persist();
                        }
                    }
                    break;

                case 'CREATE_CARDS':
                    {
                        let boardId = currentBoardId;
                        if (action.boardName) {
                            const board = boardsMeta.find(b => b.name.toLowerCase().trim() === action.boardName.toLowerCase().trim());
                            if (board) {
                                boardId = board.id;
                                if (boardId !== currentBoardId) {
                                    switchBoard(boardId);
                                }
                            }
                        }

                        let container = null;
                        let whenVal = "";

                        if (action.time) {
                            whenVal = getActiveDay() + 'T' + action.time;
                            const slot = slotsRoot.querySelector(`.list.slot[data-time="${action.time}"]`);
                            if (slot) container = slot.querySelector('.cards');
                        } else if (action.goal) {
                            whenVal = getActiveDay() + 'TGOAL';
                            const goalSlot = slotsRoot.querySelector('.list.goal-slot');
                            if (goalSlot) container = goalSlot.querySelector('.cards');
                        } else if (action.quadrant) {
                            const quadList = matrixEl.querySelector(`.list[data-quad="${action.quadrant}"]`);
                            if (quadList) container = quadList.querySelector('.cards');
                        } else {
                            let listTitle = action.listTitle || "Para Fazer";
                            let listEl = $('.list[data-type="kanban"]', boardEl).find(l => l.querySelector('.title').value.toLowerCase().trim() === listTitle.toLowerCase().trim());
                            if (!listEl) {
                                listEl = createList(listTitle);
                            }
                            container = listEl.querySelector('.cards');
                        }

                        if (container && action.cards) {
                            action.cards.forEach(cData => {
                                const cardData = {
                                    text: cData.text,
                                    color: cData.color || (action.quadrant ? MATRIX_COLORS[action.quadrant] : ""),
                                    due: cData.due || "",
                                    when: whenVal,
                                    timerTotal: cData.timerTotal ? String(cData.timerTotal) : ""
                                };
                                const newCard = createCard(cardData);
                                container.appendChild(newCard);
                            });
                            persist();
                            updateSlotsHasItems();
                            updateTotalTimerDisplay();
                        }
                    }
                    break;

                case 'COMPLETE_CARDS':
                    {
                        let targetCards = [];
                        if (action.timeRange) {
                            allCards.forEach(c => {
                                if (c.dataset.when && /T\d{2}:\d{2}$/.test(c.dataset.when)) {
                                    const timeStr = c.dataset.when.split('T')[1];
                                    const hour = parseInt(timeStr.split(':')[0], 10);
                                    let match = false;
                                    if (action.timeRange === 'morning' && hour >= 6 && hour < 12) match = true;
                                    else if (action.timeRange === 'afternoon' && hour >= 12 && hour < 18) match = true;
                                    else if ((action.timeRange === 'evening' || action.timeRange === 'night') && hour >= 18 && hour <= 23) match = true;
                                    else if (action.timeRange === 'all') match = true;

                                    if (match && c.dataset.completed !== 'true') {
                                        targetCards.push(c);
                                    }
                                }
                            });
                        } else if (action.time) {
                            const whenVal = getActiveDay() + 'T' + action.time;
                            allCards.forEach(c => {
                                if (c.dataset.when === whenVal && c.dataset.completed !== 'true') {
                                    targetCards.push(c);
                                }
                            });
                        } else if (action.quadrant) {
                            const quadList = matrixEl.querySelector(`.list[data-quad="${action.quadrant}"]`);
                            if (quadList) {
                                $( '.card', quadList).forEach(c => {
                                    const cardInCache = allCards.find(cacheCard => cacheCard === c);
                                    if (cardInCache && cardInCache.dataset.completed !== 'true') {
                                        targetCards.push(cardInCache);
                                    }
                                });
                            }
                        } else if (action.listTitle) {
                            const listEl = $('.list[data-type="kanban"]', boardEl).find(l => l.querySelector('.title').value.toLowerCase().trim() === action.listTitle.toLowerCase().trim());
                            if (listEl) {
                                $( '.card', listEl).forEach(c => {
                                    const cardInCache = allCards.find(cacheCard => cacheCard === c);
                                    if (cardInCache && cardInCache.dataset.completed !== 'true') {
                                        targetCards.push(cardInCache);
                                    }
                                });
                            }
                        } else if (action.all) {
                            allCards.forEach(c => {
                                if (c.dataset.completed !== 'true') {
                                    targetCards.push(c);
                                }
                            });
                        }

                        if (targetCards.length > 0) {
                            const executeCompletion = () => {
                                targetCards.forEach(card => {
                                    card.dataset.completed = 'true';
                                    card.classList.remove('timer-finished');
                                    if (card.dataset.timerState === 'finished') {
                                        card.dataset.timerState = 'stopped';
                                    }
                                    updateTimerDisplay(card);
                                });
                                persist();
                                updateSlotsHasItems();
                            };

                            if (action.all) {
                                showConfirm(`A IA deseja marcar TODOS os cartões como concluídos. Permitir?`, executeCompletion);
                            } else {
                                executeCompletion();
                            }
                        }
                    }
                    break;

                case 'DELETE_LIST':
                    if (action.listTitle) {
                        const listEl = $('.list[data-type="kanban"]', boardEl).find(l => l.querySelector('.title').value.toLowerCase().trim() === action.listTitle.toLowerCase().trim());
                        if (listEl) {
                            showConfirm(`A IA deseja excluir a lista "${action.listTitle}". Permitir?`, function() {
                                listEl.remove();
                                persist();
                            });
                        }
                    }
                    break;

                case 'DELETE_CARD':
                    if (action.cardText) {
                        const c = allCards.find(card => {
                            const txt = card.querySelector('.text');
                            return txt && txt.textContent.toLowerCase().trim().includes(action.cardText.toLowerCase().trim());
                        });
                        if (c) {
                            showConfirm(`A IA deseja excluir o cartão "${action.cardText}". Permitir?`, function() {
                                removeCard(c, true);
                            });
                        }
                    }
                    break;

                case 'DUPLICATE_CARD':
                    if (action.cardText) {
                        const c = allCards.find(card => {
                            const txt = card.querySelector('.text');
                            return txt && txt.textContent.toLowerCase().trim().includes(action.cardText.toLowerCase().trim());
                        });
                        if (c) {
                            const dupData = cardToData(c);
                            const newCard = createCard(dupData);
                            if (c.parentNode) {
                                c.parentNode.insertBefore(newCard, c.nextSibling);
                            }
                            persist();
                            if (typeof renderWeeklyView === 'function') {
                                renderWeeklyView();
                            }
                        }
                    }
                    break;

                case 'MOVE_CARD':
                    if (action.cardText) {
                        const c = allCards.find(card => {
                            const txt = card.querySelector('.text');
                            return txt && txt.textContent.toLowerCase().trim().includes(action.cardText.toLowerCase().trim());
                        });
                        if (c) {
                            if (action.targetBoardId || action.targetBoardName) {
                                let board = null;
                                if (action.targetBoardId) {
                                    board = boardsMeta.find(b => b.id === action.targetBoardId);
                                } else {
                                    board = boardsMeta.find(b => b.name.toLowerCase().trim() === action.targetBoardName.toLowerCase().trim());
                                }
                                if (board) {
                                    moveCardToBoard(c, board.id, action.targetListTitle || 'Inbox');
                                }
                            } else if (action.targetListTitle) {
                                const listEl = $('.list').find(l => {
                                    const titleInput = l.querySelector('.title');
                                    const title = titleInput ? titleInput.value : (l.dataset.quad || l.dataset.time || '');
                                    return title.toLowerCase().trim() === action.targetListTitle.toLowerCase().trim();
                                });
                                if (listEl) {
                                    const dest = listEl.querySelector('.cards');
                                    if (dest) {
                                        dest.appendChild(c);
                                        persist();
                                    }
                                }
                            }
                        }
                    }
                    break;

                case 'MOVE_LIST':
                    if (action.listTitle && (action.targetBoardId || action.targetBoardName)) {
                        const listEl = $('.list[data-type="kanban"]', boardEl).find(l => l.querySelector('.title').value.toLowerCase().trim() === action.listTitle.toLowerCase().trim());
                        let board = null;
                        if (action.targetBoardId) {
                            board = boardsMeta.find(b => b.id === action.targetBoardId);
                        } else {
                            board = boardsMeta.find(b => b.name.toLowerCase().trim() === action.targetBoardName.toLowerCase().trim());
                        }
                        if (listEl && board) {
                            var cardsData = $('.card', listEl).map(c => {
                                var cardData = cardToData(c);
                                cardData.boardId = board.id;
                                return cardData;
                            });

                            var targetData = [];
                            var targetLocalStr = localStorage.getItem(LS_BOARD_PREFIX + board.id);
                            if (targetLocalStr) {
                                try { targetData = JSON.parse(targetLocalStr); } catch (e) { targetData = []; }
                            }

                            var targetList = targetData.find(l => l.type === 'kanban' && l.title === action.listTitle);
                            if (targetList) {
                                if (!targetList.cards) targetList.cards = [];
                                targetList.cards = targetList.cards.concat(cardsData);
                            } else {
                                targetData.push({
                                    type: 'kanban',
                                    title: action.listTitle,
                                    cards: cardsData,
                                    boardId: board.id
                                });
                            }

                            localStorage.setItem(LS_BOARD_PREFIX + board.id, JSON.stringify(targetData));
                            if (isFirebaseReady && auth && auth.currentUser) {
                                db.ref('users/' + auth.currentUser.uid + '/boards/' + board.id).set(targetData);
                            }

                            listEl.remove();
                            persist();

                            board.lastModified = Date.now();
                            saveBoardsMetadata();

                            showToast(`Lista "${action.listTitle}" movida para o quadro "${board.name}"`);
                        }
                    }
                    break;

                case 'CHANGE_THEME':
                    if (action.color || action.themeName) {
                        let color = action.color;
                        if (action.themeName) {
                            const themeKey = Object.keys(THEMES).find(key => THEMES[key].name.toLowerCase().trim().includes(action.themeName.toLowerCase().trim()));
                            if (themeKey) color = themeKey;
                        }
                        if (color && THEMES[color]) {
                            const board = boardsMeta.find(b => b.id === currentBoardId);
                            if (board) {
                                board.color = color;
                                board.lastModified = Date.now();
                                saveBoardsMetadata();
                                setBoardTheme(color);
                                persist();
                            }
                        }
                    }
                    break;

                case 'START_TIMER':
                    if (action.cardText) {
                        const c = allCards.find(card => {
                            const txt = card.querySelector('.text');
                            return txt && txt.textContent.toLowerCase().trim().includes(action.cardText.toLowerCase().trim());
                        });
                        if (c) {
                            if (!c.dataset.timerTotal || parseInt(c.dataset.timerTotal, 10) <= 0) {
                                c.dataset.timerTotal = action.minutes ? (action.minutes * 60) : 1800;
                                c.dataset.timerLeft = c.dataset.timerTotal;
                            }
                            startCardTimer(c);
                        }
                    }
                    break;

                case 'PAUSE_TIMER':
                    if (action.cardText) {
                        const c = allCards.find(card => {
                            const txt = card.querySelector('.text');
                            return txt && txt.textContent.toLowerCase().trim().includes(action.cardText.toLowerCase().trim());
                        });
                        if (c) {
                            pauseCardTimer(c);
                        }
                    } else {
                        allCards.forEach(c => {
                            if (c.dataset.timerState === 'running') {
                                pauseCardTimer(c);
                            }
                        });
                    }
                    break;

                case 'TOGGLE_PANEL':
                    if (action.panel) {
                        const panel = action.panel.toLowerCase().trim();
                        if (panel === 'kanban' || panel === 'quadro') {
                            document.getElementById('toggleBoardBtn').click();
                        } else if (panel === 'matrix' || panel === 'matriz') {
                            document.getElementById('toggleMatrixBtn').click();
                        } else if (panel === 'agenda') {
                            document.getElementById('toggleAgendaBtn').click();
                        } else if (panel === 'weekly' || panel === 'semana') {
                            document.getElementById('toggleWeeklyBtn').click();
                        }
                    }
                    break;

                case 'COPY_PASTE_AGENDA':
                    if (action.fromDay && action.toDay) {
                        copyAgendaFromTo(action.fromDay, action.toDay);
                    }
                    break;
            }
        } catch (err) {
            console.error("Erro executando ação da IA:", action, err);
        }
    });
}

function copyAgendaFromTo(fromDay, toDay) {
    if (fromDay === toDay) return;
    const cardsToCopy = allCards.filter(c => (c.dataset.when || '').startsWith(fromDay + 'T')).map(c => ({
        ...cardToData(c),
        timeOrGoal: (c.dataset.when || '').substring(11)
    }));
    cardsToCopy.forEach(cardData => {
        const newData = { ...cardData };
        newData.when = toDay + 'T' + newData.timeOrGoal;
        const existsInCache = allCards.some(c => c.dataset.when === newData.when && c.querySelector('.text').textContent.trim() === newData.text.trim());
        if (!existsInCache) {
            createCard(newData);
        }
    });
    updateSlotsHasItems();
    persist();
}

function initAiControls() {
    const sendBtn = document.getElementById('aiSendBtn');
    if (sendBtn) sendBtn.addEventListener('click', submitAiCommand);
    
    const inputEl = document.getElementById('aiInput');
    if (inputEl) {
        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitAiCommand();
            }
        });
    }
    
    const configBtn = document.getElementById('aiConfigBtn');
    if (configBtn) configBtn.addEventListener('click', configureApiKeyDialog);
    
    const micBtn = document.getElementById('aiMicBtn');
    if (micBtn) micBtn.addEventListener('click', toggleVoiceRecord);

    initSpeechRecognition();
}

allCards.forEach(c => {
if (c.dataset.alertEnabled === 'true' && c.dataset.alertFired !== 'true') {
const whenVal = c.dataset.when || '';
if (whenVal.includes('T')) {

else if (unit === 'dias') factor = 24 * 60 * 60 * 1000;
else if (unit === 'semanas') factor = 7 * 24 * 60 * 60 * 1000;
const alertTime = eventDate.getTime() - (val * factor);
if (now >= alertTime && now < eventDate.getTime() + 10 * 60 * 1000) {
c.dataset.alertFired = 'true';
anyFired = true;
playBeep();
setTimeout(playBeep, 200);
showNotificationToast((c.querySelector('.text') ? 
       c.querySelector('.text').textContent : '').trim(), cardTime);

}
}
}

});

}, 10000); // Check every 10 seconds for responsive alerting
}

function parseRecurrenceRule(recurrenceVal) {
    if (!recurrenceVal || recurrenceVal === 'none') return null;
    let rule = null;
    if (recurrenceVal.startsWith('{')) {
        try {
            rule = JSON.parse(recurrenceVal);
        } catch (e) {
            console.error("Error parsing recurrence JSON", e);
        }
    } else {
        if (recurrenceVal === 'daily') {
            rule = { freq: 'daily', interval: 1, endType: 'never' };
        } else if (recurrenceVal === 'weekdays') {
            rule = { freq: 'weekly', interval: 1, days: [1, 2, 3, 4, 5], endType: 'never' };
        } else if (recurrenceVal === 'weekly') {
            rule = { freq: 'weekly', interval: 1, endType: 'never' };
        } else if (recurrenceVal === 'monthly') {
            rule = { freq: 'monthly', interval: 1, endType: 'never' };
        }
    }
    return rule;
}

function getNextRecurrenceDate(parentDateStr, rule) {
    const startDate = new Date(parentDateStr + 'T12:00:00');
    let currentDate = new Date(startDate);
    
    if (rule.freq === 'daily') {
        currentDate.setDate(currentDate.getDate() + rule.interval);
    } else if (rule.freq === 'weekly') {
        let found = false;
        for (let attempt = 0; attempt < 365; attempt++) {
            currentDate.setDate(currentDate.getDate() + 1);
            const startTemp = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate(), 12, 0, 0);
            const currentTemp = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate(), 12, 0, 0);
            const startSun = new Date(startTemp);
            startSun.setDate(startSun.getDate() - startSun.getDay());
            const currentSun = new Date(currentTemp);
            currentSun.setDate(currentSun.getDate() - currentSun.getDay());
            const msDiff = currentSun.getTime() - startSun.getTime();
            const weeksDiff = Math.round(msDiff / (7 * 24 * 60 * 60 * 1000));
            if (weeksDiff % rule.interval === 0) {
                const dayOfWeek = currentDate.getDay();
                if (!rule.days || rule.days.length === 0 || rule.days.includes(dayOfWeek)) {
                    found = true;
                    break;
                }
            }
        }
        if (!found) return null;
    } else if (rule.freq === 'monthly') {
        currentDate.setMonth(currentDate.getMonth() + rule.interval);
    } else if (rule.freq === 'yearly') {
        currentDate.setFullYear(currentDate.getFullYear() + rule.interval);
    } else {
        return null;
    }
    
    return currentDate.toISOString().split('T')[0];
}

function generateRecurrences(parentCard) {
const parentId = parentCard.dataset.cardId;
if (!parentId) return;
const parentDateStr = parentCard.dataset.when.split('T')[0];
const parentTimeSuffix = parentCard.dataset.when.includes('T') ? 
       parentCard.dataset.when.split('T')[1] : '';
// Delete all future child cards belonging to this parent
allCards = allCards.filter(c => {
if (c.dataset.recurrenceParent === parentId) {
c.remove();
return false;
}
return true;
});
const recurrenceVal = parentCard.dataset.recurrence;
if (!recurrenceVal || recurrenceVal === 'none') {
return;
}
let rule = null;
if (recurrenceVal.startsWith('{')) {
try {
rule = JSON.parse(recurrenceVal);
} catch (e) {
console.error("Error parsing recurrence JSON", e);
}
} else {
// Fallback to simple predefined recurrence configurations
if (recurrenceVal === 'daily') {
rule = { freq: 'daily', interval: 1, endType: 'never' };
} else if (recurrenceVal === 'weekdays') {
rule = { freq: 'weekly', interval: 1, days: [1, 2, 3, 4, 5], endType: 'never' };
} else if (recurrenceVal === 'weekly') {
const sDate = new Date(parentDateStr + 'T12:00:00');
rule = { freq: 'weekly', interval: 1, days: [sDate.getDay()], endType: 'never' };
} else if (recurrenceVal === 'monthly') {
rule = { freq: 'monthly', interval: 1, endType: 'never' };
}
}
if (!rule) return;
const startDate = new Date(parentDateStr + 'T12:00:00');
let currentDate = new Date(startDate);
let count = 0;
let maxInstances = 365; // safety limit
let instancesToGenerate = 30; // default for daily/weekdays
if (rule.freq === 'weekly') instancesToGenerate = 12;
if (rule.freq === 'monthly') instancesToGenerate = 12;
if (rule.freq === 'yearly') instancesToGenerate = 5;
if (rule.endType === 'count') {
instancesToGenerate = Math.min(rule.endCount || 1, maxInstances);
}
const endLimitDate = (rule.endType === 'date' && rule.endDate) ? new Date(rule.endDate + 
       'T23:59:59') : null;
while (count < instancesToGenerate) {
if (rule.freq === 'daily') {
currentDate.setDate(currentDate.getDate() + rule.interval);
} else if (rule.freq === 'weekly') {
let found = false;
for (let attempt = 0; attempt < 365; attempt++) {
currentDate.setDate(currentDate.getDate() + 1);
const startTemp = new Date(startDate.getFullYear(), startDate.getMonth(), 
       startDate.getDate(), 12, 0, 0);
const currentTemp = new Date(currentDate.getFullYear(), currentDate.getMonth(), 
       currentDate.getDate(), 12, 0, 0);
const startSun = new Date(startTemp);
startSun.setDate(startSun.getDate() - startSun.getDay());
const currentSun = new Date(currentTemp);
currentSun.setDate(currentSun.getDate() - currentSun.getDay());
const msDiff = currentSun.getTime() - startSun.getTime();
const weeksDiff = Math.round(msDiff / (7 * 24 * 60 * 60 * 1000));
if (weeksDiff % rule.interval === 0) {
const dayOfWeek = currentDate.getDay();
if (!rule.days || rule.days.length === 0 || rule.days.includes(dayOfWeek)) {
found = true;
break;
}
}
}
if (!found) break;
} else if (rule.freq === 'monthly') {
currentDate.setMonth(currentDate.getMonth() + rule.interval);
} else if (rule.freq === 'yearly') {
currentDate.setFullYear(currentDate.getFullYear() + rule.interval);
} else {
break;
}
if (endLimitDate && currentDate > endLimitDate) {
break;
}
const dateStr = currentDate.toISOString().slice(0, 10);
const exceptions = parentCard.dataset.recurrenceExceptions || '';
const exceptionList = exceptions ? exceptions.split(',') : [];
if (exceptionList.includes(dateStr)) {
    continue;
}
const whenVal = dateStr + 'T' + parentTimeSuffix;
const childData = {
text: (parentCard.querySelector('.text') ? 
       parentCard.querySelector('.text').textContent : '').trim(),
color: parentCard.dataset.color || '',
labelColor: parentCard.dataset.labelColor || '',
due: parentCard.dataset.due || '',
when: whenVal,
timerTotal: parentCard.dataset.timerTotal || '',
timerLeft: parentCard.dataset.timerLeft || '',
timerState: 'stopped',
timerEnd: '',
completed: 'false',
history: JSON.stringify([{ action: 'Criado por recorr\u00eancia personalizada', time: 
       Date.now() }]),
boardId: parentCard.dataset.boardId || '',
description: parentCard.dataset.description || '',
duration: parentCard.dataset.duration || '',
recurrence: 'none',
cardId: 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
recurrenceParent: parentId,
alertEnabled: parentCard.dataset.alertEnabled || 'false',
alertValue: parentCard.dataset.alertValue || '15',
alertUnit: parentCard.dataset.alertUnit || 'minutos',
alertFired: 'false'
};
createCard(childData);
count++;
}
}

// Render Clock Face Numbers
function renderFace() {

numEl.dataset.value = h;
const angle = (h * 30 - 90) * Math.PI / 180;
const x = centerX + 92 * Math.cos(angle) - 14;
const y = centerY + 92 * Math.sin(angle) - 14;
numEl.style.left = x + 'px';
numEl.style.top = y + 'px';
faceContainer.appendChild(numEl);
}
// Inner circle (12-23)
for (let h = 12; h < 24; h++) {
const numEl = el('div', 'analog-time-picker-number');
numEl.textContent = h.toString();
numEl.dataset.value = h;
const angle = ((h - 12) * 30 - 90) * Math.PI / 180;
const x = centerX + 62 * Math.cos(angle) - 14;
const y = centerY + 62 * Math.sin(angle) - 14;
numEl.style.left = x + 'px';
numEl.style.top = y + 'px';
faceContainer.appendChild(numEl);
}
updateNeedle(currentHour);
} else {
// Minutes (0-55, step 5)
for (let m = 0; m < 60; m += 5) {
const numEl = el('div', 'analog-time-picker-number');
numEl.textContent = m === 0 ? '0' : to2(m);
numEl.dataset.value = m;
const angle = ((m / 5) * 30 - 90) * Math.PI / 180;

const y = centerY + 92 * Math.sin(angle) - 14;

}
// InTer\u00e7active selection handler from click/touch coordinates
function handlePointer(clientX, clientY, isEnd = false) {

const y = clientY - rect.top - 115;

if (isEnd) {
// Switch to minutes mode on release
activeMode = 'minute';
hourInput.classList.remove('active');

renderFace();
}
} else {
let minVal = Math.round(angleDeg / 6) % 60;
currentMinute = minVal;
minuteInput.value = to2(currentMinute);
updateNeedle(currentMinute);
}
}

e.preventDefault();

faceContainer.onpointermove = (e) => {

e.preventDefault();

}
};
faceContainer.onpointerup = (e) => {

        if (mirrorCard) return mirrorCard;
        return focusActiveCard;
    }

    return null;
}

    var currentSelection = getSelectionOr(ctxTarget);
    const activeEl = document.activeElement;
    const isEditingCard = activeEl.isContentEditable && activeEl.classList.contains('text') && activeEl.closest('.card');
    if (e.key === 'F2') {

        return;

    if (!currentSelection.length && !ctxTarget && (e.key === 'Delete' || e.key === 'Backspace')) return;

    if (currentSelection.length > 0 && (e.ctrlKey || e.metaKey)) {

        // Helpers
        function shiftCardDate(card, days) {
            let when = card.dataset.when || '';
            if (!when) return false;
            let parts = when.split('T');
            let dateStr = parts[0];
            let timeStr = parts[1] || '';
            let date = new Date(dateStr + 'T12:00:00');
            if (isNaN(date.getTime())) return false;
            date.setDate(date.getDate() + days);
            let newDateStr = date.toISOString().split('T')[0];
            card.dataset.when = newDateStr + 'T' + timeStr;
            return true;

        // Shift time helper
        function shiftCardTime(card, minutes) {
            let when = card.dataset.when || '';

            let hrs = parseInt(timeParts[0], 10);

            let totalMins = hrs * 60 + mins + minutes;
            if (totalMins < 0) totalMins = 0;
            if (totalMins >= 24 * 60) totalMins = 24 * 60 - 30;
            let newHrs = Math.floor(totalMins / 60);

                while (nextCard && nextCard.style.display === 'none') {

                if (nextCard) {
                    let afterNextCard = nextCard.nextElementSibling;

                    moved = true;
                } else {
                    // Transition Down to the quadrant below: Q1 -> Q3, Q2 -> Q4
                    let targetQuad = quad === 'Q1' ? 'Q3' : (quad === 'Q2' ? 'Q4' : null);

                        let destList = document.querySelector(`.list[data-quad="${targetQuad}"]`);

                            currentSelection.forEach(c => {
                                c.dataset.labelColor = EISENHOWER_COLORS[targetQuad];
                                destCards.insertBefore(c, destCards.firstChild);
                                paintCard(c);
                            });
                            moved = true;
                        }
                    }
                }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                // Transition Left: Q2 -> Q1, Q4 -> Q3
                let targetQuad = quad === 'Q2' ? 'Q1' : (quad === 'Q4' ? 'Q3' : null);
                if (targetQuad) {

            } else if (e.key === 'ArrowRight') {

                // Transition Right: Q1 -> Q2, Q3 -> Q4
                let targetQuad = quad === 'Q1' ? 'Q2' : (quad === 'Q3' ? 'Q4' : null);
                if (targetQuad) {
                    let destList = document.querySelector(`.list[data-quad="${targetQuad}"]`);
                    if (destList) {
                        let destCards = destList.querySelector('.cards');
                        currentSelection.forEach(c => {
                            c.dataset.labelColor = EISENHOWER_COLORS[targetQuad];
                            destCards.appendChild(c);
                            paintCard(c);
                        });
                        moved = true;
                    }
                }
            }
        }
        // 3. Kanban cards
        else if (parentList && parentList.dataset.type === 'kanban') {
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                let previousCard = targetCard.previousElementSibling;
                while (previousCard && previousCard.style.display === 'none') {
                    previousCard = previousCard.previousElementSibling;
                }
                if (previousCard) {
                    currentSelection.forEach(card => parentCards.insertBefore(card, previousCard));
                    moved = true;
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                let lastCardInSelection = currentSelection[currentSelection.length - 1];
                let nextCard = lastCardInSelection.nextElementSibling;
                while (nextCard && nextCard.style.display === 'none') {
                    nextCard = nextCard.nextElementSibling;
                }
                if (nextCard) {
                    let afterNextCard = nextCard.nextElementSibling;
                    currentSelection.forEach(card => parentCards.insertBefore(card, afterNextCard));
                    moved = true;
                } else {
                    currentSelection.forEach(card => parentCards.appendChild(card));

            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                let prevList = parentList.previousElementSibling;

                    applyWhen(nextList, currentSelection);
                    currentSelection.forEach(card => destCards.appendChild(card));

        if (moved) {

        }
    }

    scrollSpeed = { x: 0, y: 0 };
    if (e.clientY < rect.top + threshold) scrollSpeed.y = -speed; else if (e.clientY > rect.bottom - threshold) scrollSpeed.y = speed;
    if (e.clientX < rect.left + threshold) scrollSpeed.x = -speed; else if (e.clientX > rect.right - threshold) scrollSpeed.x = speed;
    if ((scrollSpeed.x !== 0 || scrollSpeed.y !== 0) && !scrollFrame) scrollFrame = requestAnimationFrame(performAutoScroll);
});

var focusActiveCard = null;
var focusFilterMode = 'all';
var focusDragSourceCard = null;

// Variáveis Globais de Estado do Treemap
var focusViewMode = 'list'; // 'list' | 'treemap'
var focusSizeCriteria = 'default'; // 'default' | 'age-oldest' | 'age-newest' | 'timer-largest' | 'timer-smallest'
var treemapZoom = 1;
var treemapPanX = 0;
var treemapPanY = 0;

function setupFocusTreemapControls() {

function setupTreemapInteractivity() {
    const container = document.getElementById('focusTreemapContainer');
    const canvas = document.getElementById('focusTreemapCanvas');
    const resetBtn = document.getElementById('focusTreemapResetBtn');
    if (!container || !canvas) return;
    
    let isDragging = false;
    let startX = 0, startY = 0;

    container.onwheel = (e) => {
        e.preventDefault();
        const factor = 1.1;
        let newZoom = treemapZoom;
        if (e.deltaY < 0) {
            newZoom *= factor;
        } else {
            newZoom /= factor;
        }
        newZoom = Math.max(0.5, Math.min(newZoom, 4.0));

        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        treemapPanX = mouseX - (mouseX - treemapPanX) * (newZoom / treemapZoom);
        treemapPanY = mouseY - (mouseY - treemapPanY) * (newZoom / treemapZoom);
        treemapZoom = newZoom;

        applyTreemapTransform();
    };

    container.onmousedown = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.card') || e.target.closest('.focus-timer-item')) return;
        isDragging = true;
        startX = e.clientX - treemapPanX;
        startY = e.clientY - treemapPanY;
    };

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        treemapPanX = e.clientX - startX;
        treemapPanY = e.clientY - startY;
        applyTreemapTransform();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    if (resetBtn) {
        resetBtn.onclick = resetTreemapView;
    }
}

function applyTreemapTransform() {
    const canvas = document.getElementById('focusTreemapCanvas');
    if (canvas) {
        canvas.style.transform = `translate(${treemapPanX}px, ${treemapPanY}px) scale(${treemapZoom})`;
    }
}

function resetTreemapView() {
    treemapZoom = 1;
    treemapPanX = 0;
    treemapPanY = 0;
    applyTreemapTransform();
}

function getCardAge(card) {
    try {
        const history = JSON.parse(card.dataset.history || '[]');
        if (history.length > 0 && history[0].time) {
            return history[0].time;
        }
    } catch(e) {}
    if (card.dataset.createdTime) {
        return parseInt(card.dataset.createdTime, 10);
    }
    return Date.now();
}

function calculateSquarifiedTreemap(items, containerRect, onLayoutCard) {
    if (items.length === 0) return;
    const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
    const containerArea = containerRect.w * containerRect.h;
    if (totalWeight === 0 || containerArea === 0) return;

    const data = items.map(item => ({
        ...item,
        area: (item.weight / totalWeight) * containerArea
    })).sort((a, b) => b.area - a.area);

    let x = containerRect.x, y = containerRect.y;
    let w = containerRect.w, h = containerRect.h;
    let remaining = [...data];

    while (remaining.length > 0) {
        const side = Math.min(w, h);
        const row = [];
        let rowArea = 0;

        while (remaining.length > 0) {
            const next = remaining[0];
            const nextRowArea = rowArea + next.area;
            const currentRatio = worstRatio(row, side, rowArea);
            const nextRatio = worstRatio([...row, next], side, nextRowArea);

            if (row.length > 0 && nextRatio > currentRatio) break;
            row.push(remaining.shift());
            rowArea = nextRowArea;
        }

        const rowHeight = rowArea / side;
        let offset = 0;

        row.forEach(item => {
            const itemLength = item.area / rowHeight;
            let rx, ry, rw, rh;
            if (w >= h) {
                rx = x; ry = y + offset; rw = rowHeight; rh = itemLength;
            } else {
                rx = x + offset; ry = y; rw = itemLength; rh = rowHeight;
            }
            onLayoutCard(item, { x: rx, y: ry, w: rw, h: rh });
            offset += itemLength;
        });

        if (w >= h) {
            x += rowHeight; w -= rowHeight;
        } else {
            y += rowHeight; h -= rowHeight;
        }
    }
}

function worstRatio(row, side, rowArea) {
    if (row.length === 0) return Infinity;
    let minArea = Infinity, maxArea = -Infinity;
    row.forEach(item => {
        if (item.area < minArea) minArea = item.area;
        if (item.area > maxArea) maxArea = item.area;
    });
    const sideSq = side * side, rowAreaSq = rowArea * rowArea;
    return Math.max((sideSq * maxArea) / rowAreaSq, rowAreaSq / (sideSq * minArea));
}

function renderFocusTreemap(filteredCards) {
    const canvas = document.getElementById('focusTreemapCanvas');
    if (!canvas) return;
    canvas.innerHTML = '';

    const rect = canvas.parentElement.getBoundingClientRect();
    const containerWidth = rect.width || 400;
    const containerHeight = rect.height || 280;

    if (filteredCards.length === 0) return;

    // 1. Extração de Metadados e Cálculo de Pesos
    let items = [];
    if (focusSizeCriteria === 'default') {
        items = filteredCards.map(c => ({ card: c, weight: 1 }));
    } else if (focusSizeCriteria.startsWith('age-')) {
        const ages = filteredCards.map(c => getCardAge(c));
        const minAge = Math.min(...ages);
        const maxAge = Math.max(...ages);
        const diff = maxAge - minAge;

        items = filteredCards.map(c => {
            const age = getCardAge(c);
            let w = 1;
            if (diff > 0) {
                w = focusSizeCriteria === 'age-oldest' 
                    ? 1 + 9 * ((maxAge - age) / diff) 
                    : 1 + 9 * ((age - minAge) / diff);
            }
            return { card: c, weight: w };
        });
    } else if (focusSizeCriteria.startsWith('timer-')) {
        const timers = filteredCards.map(c => Math.max(parseInt(c.dataset.timerLeft || c.dataset.timerTotal || '0', 10), 1));
        const minT = Math.min(...timers);
        const maxT = Math.max(...timers);
        const diff = maxT - minT;

        items = filteredCards.map(c => {
            const tVal = Math.max(parseInt(c.dataset.timerLeft || c.dataset.timerTotal || '0', 10), 1);
            let w = tVal;
            if (focusSizeCriteria === 'timer-smallest') {
                w = diff > 0 ? 1 + 9 * ((maxT - tVal) / diff) : 1;
            }
            return { card: c, weight: w };
        });
    }

    // 2. Executa o Layout do Treemap
    calculateSquarifiedTreemap(items, { x: 0, y: 0, w: containerWidth, h: containerHeight }, (item, rect) => {
        const c = item.card;
        
        // Criação de Wrapper absoluto
        const wrapper = document.createElement('div');
        wrapper.className = 'treemap-card-wrapper';
        wrapper.style.left = `${rect.x}px`;
        wrapper.style.top = `${rect.y}px`;
        wrapper.style.width = `${rect.w}px`;
        wrapper.style.height = `${rect.h}px`;

        // Clone interativo do cartão original
        const cardClone = c.cloneNode(true);
        cardClone.className = 'treemap-card';
        cardClone.classList.remove('selected', 'dragging');
        cardClone.removeAttribute('draggable');
        
        if (c === focusActiveCard) {
            cardClone.classList.add('active');
        }

        // Garante aplicação de cor do board
        const cardColor = getBoardColor(c.dataset.boardId) || c.dataset.color;
        if (cardColor) {
            cardClone.style.setProperty('--board-color', cardColor);
        }

        // Associações de eventos interativos
        cardClone.onclick = (e) => {
            if (e.target.closest('.dot') || e.target.closest('.play-pause-btn') || e.target.closest('.timer-display')) return;
            focusActiveCard = c;
            updateFocusMode();
        };

        cardClone.ondblclick = (e) => {
            e.stopPropagation();
            handleCardDblClick(c);
        };

        // Eventos nos botões internos do clone
        const dot = cardClone.querySelector('.dot');
        if (dot) {
            dot.onclick = (e) => {
                e.stopPropagation();
                toggleCardCompletion({ target: dot });
                updateFocusMode();
            };
        }

        const timerDisp = cardClone.querySelector('.timer-display');
        if (timerDisp) {
            timerDisp.onclick = (e) => {
                e.stopPropagation();
                toggleCardTimer(c);
                updateFocusMode();
            };
        }

        // Atualização da exibição interna
        updateTimerDisplay(cardClone);

        wrapper.appendChild(cardClone);
        canvas.appendChild(wrapper);
    });
}

function renderFocusTimersList() {
    const listEl = document.getElementById('focusTimersList');
    if (!listEl) return;
    
    // 1. Gather all unique card elements from allCards that have a timer set and are not completed
    const timerCards = allCards.filter(c => {
        const total = parseInt(c.dataset.timerTotal || '0', 10);
        return total > 0 && c.dataset.completed !== 'true';
    });
    
    // 2. Apply active filter if selected
    const filtered = timerCards.filter(c => {
        if (focusFilterMode === 'active') {
            return c.dataset.timerState === 'paused';
        }
        return true; // 'all'
    });
    
    // 3. Apply sorting
    const focusSortSelect = document.getElementById('focusSortSelect');
    const sortVal = focusSortSelect ? focusSortSelect.value : 'default';
    if (sortVal === 'shortest') {
        filtered.sort((a, b) => {
            const timeA = parseInt(a.dataset.timerLeft || a.dataset.timerTotal || '0', 10);
            const timeB = parseInt(b.dataset.timerLeft || b.dataset.timerTotal || '0', 10);
            return timeA - timeB;
        });
    } else if (sortVal === 'longest') {
        filtered.sort((a, b) => {
            const timeA = parseInt(a.dataset.timerLeft || a.dataset.timerTotal || '0', 10);
            const timeB = parseInt(b.dataset.timerLeft || b.dataset.timerTotal || '0', 10);
            return timeB - timeA;
        });
    }

    if (focusViewMode === 'list') {
        renderFocusTimersListWithData(filtered);
    } else {
        renderFocusTreemap(filtered);
    }
}

function renderFocusTimersListWithData(filtered) {
    const listEl = document.getElementById('focusTimersList');
    if (!listEl) return;
    listEl.innerHTML = '';

    if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.style.color = 'var(--muted)';
        empty.style.fontSize = '12px';
        empty.style.textAlign = 'center';
        empty.style.padding = '20px 0';
        empty.textContent = focusFilterMode === 'active' ? 'Nenhum timer pausado no momento.' : 'Nenhum timer configurado.';
        listEl.appendChild(empty);
        return;
    }
    
    filtered.forEach(c => {
        const item = document.createElement('div');
        item.className = 'focus-timer-item';
        
        // HTML5 Drag and Drop reordering
        item.draggable = true;
        item.ondragstart = (e) => {
            focusDragSourceCard = c;
            item.classList.add('dragging');
            
            // If sort is active, reset it to default
            const sortSelect = document.getElementById('focusSortSelect');
            if (sortSelect && sortSelect.value !== 'default') {
                sortSelect.value = 'default';
            }
            
            try {
                e.dataTransfer.setData('text/plain', 'focus-timer');
                e.dataTransfer.effectAllowed = 'move';
            } catch (_) {}
        };
        
        item.ondragover = (e) => {
            e.preventDefault();
            if (!focusDragSourceCard || focusDragSourceCard === c) return;
            
            const rect = item.getBoundingClientRect();
            const relY = e.clientY - rect.top;
            const midpoint = rect.height / 2;
            
            if (relY < midpoint) {
                item.classList.add('drag-over-top');
                item.classList.remove('drag-over-bottom');
            } else {
                item.classList.add('drag-over-bottom');
                item.classList.remove('drag-over-top');
            }
        };
        
        item.ondragenter = (e) => {
            e.preventDefault();
        };
        
        item.ondragleave = () => {
            item.classList.remove('drag-over-top', 'drag-over-bottom');
        };
        
        item.ondragend = () => {
            item.classList.remove('dragging');
            item.classList.remove('drag-over-top', 'drag-over-bottom');
            focusDragSourceCard = null;
        };
        
        item.ondrop = (e) => {
            e.preventDefault();
            e.stopPropagation();
            item.classList.remove('drag-over-top', 'drag-over-bottom');
            
            if (!focusDragSourceCard || focusDragSourceCard === c) return;
            
            const rect = item.getBoundingClientRect();
            const relY = e.clientY - rect.top;
            const midpoint = rect.height / 2;
            const isAbove = relY < midpoint;
            
            const targetListEl = c.closest('.list');
            if (targetListEl) {
                const sourceListEl = focusDragSourceCard.closest('.list');
                if (sourceListEl !== targetListEl) {
                    applyWhen(targetListEl, [focusDragSourceCard]);
                }
                
                if (isAbove) {
                    c.parentNode.insertBefore(focusDragSourceCard, c);
                } else {
                    c.parentNode.insertBefore(focusDragSourceCard, c.nextSibling);
                }
                
                syncAllCardsOrderFromDOM();
                updateSlotsHasItems();
                persist();
                updateFocusMode();
            }
        };

        if (c === focusActiveCard) {
            item.classList.add('active');
        }
        
        // Dynamic left border based on board color
        const cardColor = getBoardColor(c.dataset.boardId) || c.dataset.color;
        if (cardColor) {
            item.style.borderLeft = `4px solid ${cardColor}`;
        }
        
        const info = document.createElement('div');
        info.className = 'info';
        
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = (c.querySelector('.text') ? c.querySelector('.text').textContent : '').trim();
        
        const timeState = document.createElement('div');
        timeState.className = 'time-state';
        
        const seconds = parseInt(c.dataset.timerLeft || c.dataset.timerTotal || '0', 10);
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        const timeStr = `${to2(mins)}:${to2(secs)}`;
        
        let stateLabel = 'Aguardando';
        if (c.dataset.timerState === 'running') stateLabel = 'Rodando';
        else if (c.dataset.timerState === 'paused') stateLabel = 'Pausado';
        else if (c.dataset.timerState === 'finished') stateLabel = 'Finalizado';
        
        timeState.textContent = `⏱️ ${timeStr} (${stateLabel})`;
        
        info.appendChild(title);
        info.appendChild(timeState);
        
        const controls = document.createElement('div');
        controls.className = 'controls';
        
        const playBtn = document.createElement('button');
        playBtn.className = 'play-pause-btn';
        playBtn.type = 'button';
        playBtn.textContent = c.dataset.timerState === 'running' ? '⏸️' : '▶️';
        playBtn.title = c.dataset.timerState === 'running' ? 'Pausar' : 'Iniciar';
        
        playBtn.onclick = (e) => {
            e.stopPropagation();
            toggleCardTimer(c);
            updateFocusMode();
        };
        
        controls.appendChild(playBtn);
        
        item.appendChild(info);
        item.appendChild(controls);
        
        item.onclick = () => {
            focusActiveCard = c;
            updateFocusMode();
        };
        
        listEl.appendChild(item);
    });
}

function updateFocusMode() {
    // Se estiver no modo manual ou tela pequena
    const isManual = document.body.classList.contains('manual-focus-mode');
    if (window.innerWidth < 700 || isManual) {
        // Resolve a card to focus on
        let targetCard = focusActiveCard;
        // Verify if targetCard is still valid
        if (targetCard && (!allCards.includes(targetCard) || targetCard.dataset.completed === 'true')) {
            targetCard = null;
        }
        
        // If no targetCard, look for a running timer
        if (!targetCard) {
            targetCard = allCards.find(c => c.dataset.timerState === 'running');
        }
        // If still none, look for a paused/finished/stopped timer that is not completed
        if (!targetCard) {
            targetCard = allCards.find(c => {
                const total = parseInt(c.dataset.timerTotal || '0', 10);
                return total > 0 && c.dataset.completed !== 'true';
            });
        }
        
        if (targetCard) {
            focusActiveCard = targetCard;
            document.body.classList.add('focus-mode');
            
            const text = (targetCard.querySelector('.text') ? targetCard.querySelector('.text').textContent : '').trim();
            const state = targetCard.dataset.timerState || 'stopped';
            const disp = targetCard.querySelector('.timer-display');
            
            document.getElementById('focusTargetText').textContent = text;
            
            // Format time display
            let timeStr = '00:00';
            if (disp) {
                timeStr = disp.textContent.replace('⏱️ ', '').replace(' min', '').replace('⏳ ', '').trim();
            } else {
                const seconds = parseInt(targetCard.dataset.timerLeft || targetCard.dataset.timerTotal || '0', 10);
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timeStr = `${to2(mins)}:${to2(secs)}`;
            }
            document.getElementById('focusTargetTime').textContent = timeStr;
            
            const toggleBtn = document.getElementById('focusToggleBtn');
            toggleBtn.textContent = state === 'running' ? '⏸️' : '▶️';
            
            // Apply card color / board color to the focus-card-clone border & pulse animation
            const activeCardColor = getBoardColor(targetCard.dataset.boardId) || targetCard.dataset.color || '#ffa726';
            const cloneEl = document.querySelector('#focus-overlay .focus-card-clone');
            if (cloneEl) {
                cloneEl.style.setProperty('--focus-border-color', activeCardColor);
                cloneEl.style.setProperty('--focus-glow-color', activeCardColor + '66');
                cloneEl.style.setProperty('--focus-glow-color-half', activeCardColor + '33');
            }
            
            const allBtn = document.getElementById('focusFilterAll');
            const activeBtn = document.getElementById('focusFilterActive');
            if (allBtn && activeBtn) {
                if (focusFilterMode === 'all') {
                    allBtn.classList.add('active');
                    activeBtn.classList.remove('active');
                } else {
                    allBtn.classList.remove('active');
                    activeBtn.classList.add('active');
                }
            }
            
            renderFocusTimersList();
            return;
        }
    }
    document.body.classList.remove('focus-mode');
}

// ===== RESIZERS LOGIC =====
function initResizers() {
    const resizerSidebar = document.getElementById('resizer-sidebar');
    const sidebar = document.getElementById('agenda-sidebar');
    const resizerMatrix = document.getElementById('resizer-matrix');
    const matrixContainer = document.getElementById('matrix-container');
    const boardContainer = document.getElementById('board-container');
    const resizerWeekly = document.getElementById('resizer-weekly');
    const weeklyContainer = document.getElementById('weekly-container');

    // Load saved sizes
    try {
        const saved = JSON.parse(localStorage.getItem('TEA_RESIZERS') || '{}');
        if (saved.sidebarWidth && window.innerWidth > 700) sidebar.style.flexBasis = saved.sidebarWidth + 'px';
        if (saved.boardHeight) {
            const h = parseInt(saved.boardHeight);
            boardContainer.style.height = (isNaN(h) || h < 100) ? '300px' : h + 'px';
        }
        if (saved.weeklyHeight) {
            const h = parseInt(saved.weeklyHeight);
            weeklyContainer.style.height = (isNaN(h) || h < 50) ? '250px' : h + 'px';
        }
    } catch(e) {}

    function saveResizerState() {
        const state = {
            sidebarWidth: sidebar.getBoundingClientRect().width,
            boardHeight: boardContainer.getBoundingClientRect().height,
            weeklyHeight: weeklyContainer.getBoundingClientRect().height
        };
        localStorage.setItem('TEA_RESIZERS', JSON.stringify(state));
    }

    function setupResizer(resizer, type) {
        if (!resizer) return;
        let isResizing = false;
        let startX, startY, startWidth, startHeight;

        function onStart(e) {
            isResizing = true;
            resizer.classList.add('resizing');
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            
            if (type === 'sidebar') {
                startWidth = sidebar.getBoundingClientRect().width;
            } else if (type === 'matrix') {
                startHeight = boardContainer.getBoundingClientRect().height;
            } else if (type === 'weekly') {
                startHeight = weeklyContainer.getBoundingClientRect().height;
            }
            
            // Disable transitions during resize for smooth dragging
            if (type === 'sidebar') sidebar.style.transition = 'none';
            if (type === 'matrix') {
                boardContainer.style.transition = 'none';
                matrixContainer.style.transition = 'none';
            }
            if (type === 'weekly') {
                weeklyContainer.style.transition = 'none';
                boardContainer.style.transition = 'none';
            }
        }

        function onMove(e) {
            if (!isResizing) return;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            if (type === 'sidebar') {
                // Calcula a nova largura (sidebar está na direita, então mouse pra esquerda = aumenta width)
                let newWidth = startWidth - (clientX - startX);
                // Limites de tamanho
                if (newWidth < 200) newWidth = 200;
                
                // Limita o crescimento para manter a proporção dos cartões
                let maxWidth = Math.min(400, window.innerWidth * 0.8);
                if (newWidth > maxWidth) newWidth = maxWidth;
                
                sidebar.style.flexBasis = newWidth + 'px';
            } else if (type === 'matrix') {
                // Calcula a nova altura para o board (resizer entre board e matrix)
                let newHeight = startHeight + (clientY - startY);
                if (newHeight < 100) newHeight = 100; // Altura mínima do board
                if (newHeight > window.innerHeight * 0.7) newHeight = window.innerHeight * 0.7; // Altura máxima
                boardContainer.style.height = newHeight + 'px';
                boardContainer.style.flex = 'none'; // Ensure flex-grow doesn't override height
            } else if (type === 'weekly') {
                let newHeight = startHeight + (clientY - startY);
                if (newHeight < 150) newHeight = 150; // Altura mínima do weekly view
                if (newHeight > window.innerHeight * 0.8) newHeight = window.innerHeight * 0.8;
                weeklyContainer.style.height = newHeight + 'px';
                weeklyContainer.style.flex = 'none';
            }
        }

        function onEnd(e) {
            if (!isResizing) return;
            isResizing = false;
            resizer.classList.remove('resizing');
            
            // Restore transitions
            if (type === 'sidebar') sidebar.style.transition = '';
            if (type === 'matrix') {
                boardContainer.style.transition = '';
                matrixContainer.style.transition = '';
            }
            if (type === 'weekly') {
                weeklyContainer.style.transition = '';
                boardContainer.style.transition = '';
            }
            
            saveResizerState();
        }

        resizer.addEventListener('mousedown', onStart);
        resizer.addEventListener('touchstart', onStart, { passive: true });
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchmove', onMove, { passive: true });
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchend', onEnd);
    }

    setupResizer(resizerSidebar, 'sidebar');
    setupResizer(resizerMatrix, 'matrix');
    setupResizer(resizerWeekly, 'weekly');
}
